name: Deploy Jack 3D Creator

on:
  push:
    branches: [main]
    paths:
      - 'jack-3d-creator/**'
      - '.github/workflows/deploy-jack.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

    - name: Install dependencies
  working-directory: "jack-3d-creator"
  run: |
    rm -f package-lock.json
    npm install

      - name: Build project
        working-directory: "jack-3d-creator"
        run: npm run build

      - name: Prepare final public folder
        run: |
          mkdir -p "public/jack-3d-creator"
          cp -r "jack-3d-creator/dist/." "public/jack-3d-creator/"
          touch public/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
