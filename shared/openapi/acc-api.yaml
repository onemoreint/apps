openapi: 3.0.3
info:
  title: Android Control Center API
  version: 0.1.0
  description: |
    API del backend de Android Control Center. Toda operación está limitada a la
    organización del usuario autenticado. Las rutas marcadas "Fase N" se implementan
    en esa fase del plan (docs/roadmap.md).
  license: { name: Apache-2.0, url: https://www.apache.org/licenses/LICENSE-2.0 }
servers:
  - url: http://localhost:8080
tags:
  - name: auth
  - name: devices
  - name: policies
  - name: applications
  - name: audit
  - name: agent
  - name: capabilities
security:
  - bearer: []
paths:
  /api/auth/login:
    post:
      tags: [auth]
      summary: Iniciar sesión (Fase 4)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Access token; el refresh token llega en cookie HttpOnly, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { description: Demasiados intentos }
  /api/auth/refresh:
    post:
      tags: [auth]
      summary: Rotar el refresh token (Fase 4). Requiere cabecera X-CSRF-Token.
      security: []
      responses:
        '200': { description: Nuevo access token, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /api/auth/logout:
    post: { tags: [auth], summary: Cerrar sesión (Fase 4), responses: { '204': { description: Sesión cerrada } } }
  /api/devices:
    get:
      tags: [devices]
      summary: Listar dispositivos de la organización
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/DeviceState' } }
        - { name: compliance, in: query, schema: { $ref: '#/components/schemas/Compliance' } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: Página de dispositivos, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Device' } } } } }
  /api/devices/enroll:
    post:
      tags: [devices]
      summary: Crear un código de inscripción
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EnrollmentRequest' } } }
      responses:
        '201': { description: Código creado, content: { application/json: { schema: { $ref: '#/components/schemas/Enrollment' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /api/devices/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      summary: Ver un dispositivo
      tags: [devices]
      responses:
        '200': { description: Dispositivo, content: { application/json: { schema: { $ref: '#/components/schemas/Device' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [devices]
      summary: Eliminar del inventario (solo si está retirado)
      responses: { '204': { description: Eliminado }, '409': { $ref: '#/components/responses/Problem' } }
  /api/devices/{id}/capabilities:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      summary: Capacidades del dispositivo según su modo y versión
      tags: [devices]
      responses: { '200': { description: Capacidades del dispositivo, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Capability' } } } } } }
  /api/devices/{id}/policies:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      summary: Políticas aplicadas al dispositivo
      tags: [devices]
      responses: { '200': { description: Políticas aplicadas, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Policy' } } } } } }
  /api/devices/{id}/commands:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [devices]
      summary: Enviar un comando
      description: |
        Se rechaza con 422 y el mensaje "Esta operación requiere un modo de administración
        compatible o no está permitida por Android." si el modo del dispositivo no lo admite.
        WIPE_DEVICE exige confirmationText igual al nombre del dispositivo.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CommandRequest' } } }
      responses:
        '202': { description: Comando en cola, content: { application/json: { schema: { $ref: '#/components/schemas/Command' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/policies:
    get:
      summary: Listar políticas
      tags: [policies]
      responses: { '200': { description: Políticas, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Policy' } } } } } }
    post:
      summary: Crear política
      tags: [policies]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Policy' } } } }
      responses: { '201': { description: Creada }, '400': { $ref: '#/components/responses/Problem' } }
  /api/policies/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      summary: Actualizar política
      tags: [policies]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Policy' } } } }
      responses: { '200': { description: Actualizada }, '409': { $ref: '#/components/responses/Problem' } }
    delete:
      summary: Eliminar política
      tags: [policies]
      responses: { '204': { description: Eliminada }, '409': { description: Está asignada a dispositivos } }
  /api/applications:
    get:
      summary: Listar el catálogo de aplicaciones
      tags: [applications]
      responses: { '200': { description: Catálogo, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Application' } } } } } }
    post:
      summary: Agregar aplicación al catálogo
      tags: [applications]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
      responses: { '201': { description: Agregada }, '409': { description: Ya existe } }
  /api/audit:
    get:
      summary: Consultar la auditoría
      tags: [audit]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: result, in: query, schema: { type: string, enum: [SUCCESS, DENIED, ERROR] } }
      responses: { '200': { description: Eventos, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } } } } } }
  /api/agent/heartbeat:
    post:
      tags: [agent]
      summary: Heartbeat e inventario del agente (implementado; vinculación al dispositivo en Fase 6)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Heartbeat' } } } }
      responses: { '202': { description: Aceptado }, '400': { $ref: '#/components/responses/Problem' } }
  /api/capabilities/matrix:
    get:
      tags: [capabilities]
      summary: Matriz de capacidades por modo (implementado)
      security: []
      parameters: [{ name: sdk, in: query, schema: { type: integer, default: 34 } }]
      responses: { '200': { description: Matriz } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Problem:
      description: Error (RFC 9457)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Problem:
      type: object
      properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string } }
    LoginRequest:
      type: object
      required: [email, password]
      properties: { email: { type: string, format: email }, password: { type: string, minLength: 12, maxLength: 128 }, totp: { type: string, pattern: '^\d{6}$' } }
    TokenResponse:
      type: object
      properties: { accessToken: { type: string }, expiresIn: { type: integer }, mfaRequired: { type: boolean } }
    ManagementMode: { type: string, enum: [NORMAL_APP, DEVICE_ADMIN, WORK_PROFILE, FULLY_MANAGED, DEDICATED, LAB_DEVICE_OWNER] }
    DeviceState: { type: string, enum: [PENDING, ONLINE, OFFLINE, RETIRED] }
    Compliance: { type: string, enum: [COMPLIANT, NON_COMPLIANT, UNKNOWN] }
    Device:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        manufacturer: { type: string }
        model: { type: string }
        androidVersion: { type: string }
        sdkInt: { type: integer }
        serial: { type: string, nullable: true }
        mode: { $ref: '#/components/schemas/ManagementMode' }
        state: { $ref: '#/components/schemas/DeviceState' }
        compliance: { $ref: '#/components/schemas/Compliance' }
        batteryPct: { type: integer, nullable: true }
        storageFreeMb: { type: integer }
        storageTotalMb: { type: integer }
        memoryFreeMb: { type: integer }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        policyId: { type: string, format: uuid, nullable: true }
        tags: { type: array, items: { type: string } }
    Capability:
      type: object
      properties:
        capability: { type: string }
        status: { type: string, enum: [SUPPORTED, PARTIAL, UNSUPPORTED] }
        reason: { type: string }
    EnrollmentRequest:
      type: object
      required: [scenario]
      properties:
        scenario: { type: string, enum: [CORPORATE, DEDICATED, COPE, BYOD, LAB] }
        policyId: { type: string, format: uuid, nullable: true }
    Enrollment:
      type: object
      properties:
        id: { type: string, format: uuid }
        mode: { $ref: '#/components/schemas/ManagementMode' }
        token: { type: string }
        qrPayload: { type: string }
        expiresAt: { type: string, format: date-time }
        expectedCapabilities: { type: array, items: { $ref: '#/components/schemas/Capability' } }
    PolicySpec:
      type: object
      properties:
        cameraDisabled: { type: boolean }
        screenCaptureDisabled: { type: boolean }
        usbDataDisabled: { type: boolean }
        installUnknownSourcesAllowed: { type: boolean }
        playStoreMode: { type: string, enum: [ALLOWLIST, BLOCKLIST] }
        bluetoothDisabled: { type: boolean }
        wifiSsid: { type: string, maxLength: 32 }
        passwordQuality: { type: string, enum: [NONE, SOMETHING, NUMERIC_COMPLEX, ALPHANUMERIC, COMPLEX] }
        passwordMinLength: { type: integer, minimum: 0, maximum: 16 }
        systemUpdate: { type: string, enum: [AUTOMATIC, WINDOWED, POSTPONE] }
        externalStorageDisabled: { type: boolean }
        factoryResetDisabled: { type: boolean }
    Policy:
      type: object
      required: [name, riskLevel, spec]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, minLength: 3, maxLength: 80 }
        description: { type: string, maxLength: 300 }
        riskLevel: { type: string, enum: [LOW, MEDIUM, HIGH] }
        status: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
        spec: { $ref: '#/components/schemas/PolicySpec' }
        affectedDevices: { type: integer, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
        updatedBy: { type: string, readOnly: true }
    ManagedConfigEntry:
      type: object
      required: [key, type, value]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_]{1,63}$' }
        name: { type: string }
        description: { type: string }
        type: { type: string, enum: [STRING, BOOL, INTEGER, FLOAT, STRING_ARRAY] }
        value: {}
    Application:
      type: object
      required: [name, packageName, installType]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        packageName: { type: string, pattern: '^[a-zA-Z][A-Za-z0-9_]*(\.[a-zA-Z][A-Za-z0-9_]*)+$' }
        version: { type: string }
        installType: { type: string, enum: [AVAILABLE, FORCE_INSTALLED, BLOCKED, KIOSK] }
        permissions: { type: array, items: { type: string } }
        managedConfig: { type: array, items: { $ref: '#/components/schemas/ManagedConfigEntry' } }
    CommandRequest:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [GET_DEVICE_INFO, SYNC_POLICY, SYNC_APPLICATIONS, REFRESH_CONFIGURATION, SYNC_NOW, LOCK_DEVICE, REBOOT_DEVICE, WIPE_DEVICE] }
        confirmationText: { type: string }
    Command:
      type: object
      properties:
        id: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        type: { type: string }
        status: { type: string, enum: [QUEUED, SENT, SUCCEEDED, FAILED, CANCELLED, EXPIRED] }
        requestedBy: { type: string }
        createdAt: { type: string, format: date-time }
        response: { type: string, nullable: true }
        error: { type: string, nullable: true }
    AuditEvent:
      type: object
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        target: { type: string }
        deviceId: { type: string, nullable: true }
        ip: { type: string, nullable: true }
        result: { type: string, enum: [SUCCESS, DENIED, ERROR] }
    Heartbeat:
      type: object
      required: [manufacturer, model, androidVersion, sdkInt]
      properties:
        manufacturer: { type: string, maxLength: 64 }
        model: { type: string, maxLength: 64 }
        androidVersion: { type: string, maxLength: 16 }
        sdkInt: { type: integer, minimum: 21, maximum: 40 }
        serial: { type: string, nullable: true }
        batteryPct: { type: integer, minimum: 0, maximum: 100, nullable: true }
        storageFreeMb: { type: integer }
        storageTotalMb: { type: integer }
        memoryFreeMb: { type: integer }
        managementMode: { type: string }
        agentVersion: { type: string }
        enrollmentSecret: { type: string }
