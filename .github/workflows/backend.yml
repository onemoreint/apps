name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: acc
          POSTGRES_USER: acc
          POSTGRES_PASSWORD: acc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acc"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Validar migraciones en PostgreSQL 16
        run: |
          for f in src/main/resources/db/migration/*.sql; do
            PGPASSWORD=acc psql -h localhost -U acc -d acc -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Pruebas y compilación
        run: ./gradlew --no-daemon test bootJar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-report
          path: backend/build/reports/tests
          if-no-files-found: ignore
