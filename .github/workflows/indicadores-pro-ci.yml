name: INDICADORES PRO · calidad

on:
  push:
    branches: [main]
    paths:
      - 'indicadores-pro/**'
      - '.github/workflows/indicadores-pro-ci.yml'
  pull_request:
    paths:
      - 'indicadores-pro/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indicadores-pro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: indicadores-pro/package-lock.json

      - name: Instalar
        run: npm ci

      - name: Tipos (TypeScript)
        run: npm run typecheck

      - name: Pruebas (permisos, datos, interfaz y RLS en PostgreSQL)
        run: npm test

      - name: Build
        run: npm run build
