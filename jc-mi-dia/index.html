<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JC — Mi Día en Equilibrio</title>
<meta name="description" content="Organiza tu día, cumple tus metas y haz crecer tus sueños.">
<meta name="theme-color" content="#845EC2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JC Mi Día">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --coral:#FF6B81;--morado:#845EC2;--rosa:#FBE4EC;--turq:#40C9A2;--amar:#FFD166;--dorado:#E8B86D;
  --bg:#FFFCFA;--text:#293044;--verde:#2FBF71;--card:#FFFFFF;--muted:#6A7186;--line:#F1E6EA;--track:#F3ECF0;
  --soft:#FFF5F7;--shadow:0 6px 20px rgba(132,94,194,.10),0 1px 3px rgba(41,48,68,.06);
  --grad:linear-gradient(135deg,#FF6B81 0%,#845EC2 100%);
  --r:18px;--rs:12px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#16131D;--text:#F3EEF6;--card:#221E2B;--muted:#A9A2B8;--line:#342D40;--track:#2E2839;--rosa:#3A2433;--soft:#2A2231;
  --shadow:0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--morado)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
/* Header */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:10px;height:58px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--grad);color:#fff;font-weight:900;display:grid;place-items:center;letter-spacing:-.5px;box-shadow:0 4px 12px rgba(255,107,129,.35);flex:none;position:relative}
.logo::after{content:"";position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--amar)}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.savepill{font-size:12px;padding:4px 9px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.savepill.ok::before{content:"✓ "; color:var(--verde)}
.savepill.err{background:#ffe1e1;color:#b3261e}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:22px;height:22px}
/* Bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(41,48,68,.06)}
.nav .wrap{display:flex;justify-content:space-between;padding:0 4px}
.nav button{flex:1;border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);cursor:pointer;min-height:62px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--morado);font-weight:700}
.nav button.on svg{stroke:var(--morado)}
/* Layout */
main{padding:14px 0 30px}
h1{font-size:26px;line-height:1.15;margin:4px 0 2px;letter-spacing:-.3px}
h2{font-size:19px;margin:22px 0 10px;letter-spacing:-.2px}
h3{font-size:16px;margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:12px 0;border:1px solid var(--line)}
.card.flat{box-shadow:none}
.hero{background:var(--grad);color:#fff;border:0}
.hero .muted{color:rgba(255,255,255,.85)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:620px){.grid-k{grid-template-columns:repeat(4,1fr)!important}}
.row{display:flex;align-items:center;gap:10px}
.row.wrapr{flex-wrap:wrap}
.spacer{flex:1}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--soft);color:var(--text);min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;transition:transform .12s ease, filter .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(255,107,129,.30)}
.btn.turq{background:var(--turq);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{background:#FFE3E6;color:#B3261E}
:root[data-theme="dark"] .btn.danger{background:#4a2027;color:#ffb4b4}
.grid2>.btn{font-size:14.5px;padding:12px 10px}
.btn.big{width:100%;font-size:16px;padding:15px;letter-spacing:.3px}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.5;pointer-events:none}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;cursor:pointer;color:var(--text)}
.quick button span{font-size:22px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--soft);white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:8px}
.st-pendiente{background:#EEF0F5;color:#4B5268}
.st-en_curso{background:#FFF3D1;color:#8A6200}
.st-completada{background:#DDF6E8;color:#17794A}
.st-reprogramada{background:#EEE6FA;color:#5E3EA0}
.st-cancelada{background:#F1F1F1;color:#777;text-decoration:line-through}
:root[data-theme="dark"] .st-pendiente{background:#353a4a;color:#cfd3e2}
:root[data-theme="dark"] .st-en_curso{background:#4a3d14;color:#ffe08a}
:root[data-theme="dark"] .st-completada{background:#1c4a33;color:#9ff0c4}
:root[data-theme="dark"] .st-reprogramada{background:#3c2d5c;color:#d7c4ff}
:root[data-theme="dark"] .st-cancelada{background:#333;color:#aaa}
.pr-alta{color:#C2334A}.pr-media{color:#9A6B00}.pr-baja{color:var(--muted)}
/* Forms */
label{display:block;font-size:14px;font-weight:600;margin:10px 0 0}
input[type=text],input[type=number],input[type=date],input[type=time],input:not([type]),select,textarea{display:block;width:100%;margin-top:5px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);min-height:46px;font-size:16px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--morado);box-shadow:0 0 0 3px rgba(132,94,194,.15)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.check{display:flex;align-items:center;gap:10px;font-weight:500;margin-top:12px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--morado);flex:none}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips label{margin:0;font-weight:500}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-block;padding:9px 13px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-size:14px;cursor:pointer;user-select:none}
.chips input:checked+span{background:var(--morado);border-color:var(--morado);color:#fff}
.chips input:focus-visible+span{outline:2px solid var(--coral)}
.warn{background:#FFF4D6;color:#6B4E00;border-radius:12px;padding:12px;margin-top:12px;font-size:14px}
:root[data-theme="dark"] .warn{background:#43381a;color:#ffe3a1}
.info{background:var(--soft);border-radius:12px;padding:12px;font-size:14px}
.segs{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.segs button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.segs button.on{background:var(--card);color:var(--morado);box-shadow:0 1px 4px rgba(0,0,0,.08)}
/* Dashboard */
.gaugebox{display:flex;align-items:center;gap:16px}
.gaugebox .stats{flex:1;display:grid;gap:6px;font-size:14.5px}
.stat-l{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:22px;letter-spacing:-.4px}
.kpi span{font-size:13px;font-weight:700;overflow-wrap:anywhere}
.kpi p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:22px 12px;color:var(--muted)}
.empty .em{font-size:34px;display:block;margin-bottom:6px}
/* Timeline */
.daynav{display:flex;align-items:center;gap:8px;margin:6px 0 4px}
.daynav .dtitle{flex:1;text-align:center;font-weight:800}
.tl{position:relative;margin-top:12px;padding-left:62px}
.tl::before{content:"";position:absolute;left:52px;top:4px;bottom:4px;width:2px;background:var(--line);border-radius:2px}
.tl-item{position:relative;margin-bottom:10px}
.tl-time{position:absolute;left:-62px;top:10px;width:48px;text-align:right;font-size:13px;font-weight:700;color:var(--muted)}
.tl-dot{position:absolute;left:-15px;top:14px;width:12px;height:12px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.act{display:flex;gap:10px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 10px 10px 0;box-shadow:var(--shadow);cursor:pointer;overflow:hidden}
.act .bar{width:5px;border-radius:0 4px 4px 0;flex:none}
.act .body{flex:1;min-width:0}
.act .ttl{font-weight:700;overflow-wrap:anywhere}
.act.done .ttl{text-decoration:line-through;color:var(--muted)}
.act .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:4px}
.act .acts{display:flex;flex-direction:column;gap:6px;justify-content:center}
.circ{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;font-size:18px;color:var(--muted)}
.circ.ok{background:var(--verde);border-color:var(--verde);color:#fff}
.gap{font-size:12.5px;color:var(--muted);margin:-2px 0 10px;padding:6px 10px;border:1.5px dashed var(--line);border-radius:12px}
.conf{color:#9A5B00;font-weight:700}
/* Progress bars */
.pbar{height:12px;border-radius:99px;background:var(--track);overflow:hidden;position:relative}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .5s ease}
.pbar.over i{background:linear-gradient(90deg,var(--verde),var(--turq))}
.hb{display:grid;grid-template-columns:118px 1fr auto;gap:8px;align-items:center;font-size:13.5px;margin:8px 0}
.hb .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tracks{display:grid;gap:3px}
.hb .trk{height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.hb .trk i{display:block;height:100%;border-radius:99px;transition:width .5s}
.hb .val{font-weight:700;font-size:12.5px;text-align:right;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}
details.tbl{margin-top:10px}
details.tbl summary{cursor:pointer;font-size:13.5px;color:var(--morado);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
th{font-size:12.5px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.chart .v{fill:var(--text);font-weight:700}
.g-arc{transition:stroke-dasharray .7s ease}
/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(22,15,30,.45);z-index:60;opacity:0;transition:opacity .18s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg);border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;transform:translateY(100%);transition:transform .22s ease;padding:0 0 calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.show{transform:none}
.sheet .sh-head{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line);z-index:2}
.sheet .sh-head h3{flex:1;margin:0;font-size:18px}
.sheet .sh-body{padding:4px 16px 10px;max-width:760px;margin:0 auto}
@media (min-width:800px){.sheet{left:50%;width:720px;transform:translate(-50%,100%);bottom:auto;top:4vh;border-radius:22px;max-height:92vh}.sheet.show{transform:translate(-50%,0)}}
/* Toast & banners */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#293044;color:#fff;padding:12px 16px;border-radius:14px;z-index:80;opacity:0;transition:all .2s;max-width:92vw;font-size:14.5px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast button{pointer-events:auto;background:var(--amar);color:#293044;border:0;border-radius:10px;padding:7px 11px;font-weight:800;cursor:pointer}
.banner{padding:10px 14px;font-size:13.5px;text-align:center}
.banner.off{background:#293044;color:#fff}
.banner.demo{background:var(--amar);color:#293044}
.banner button{margin-left:8px;border:0;border-radius:8px;padding:4px 9px;font-weight:700;cursor:pointer;background:#fff;color:#293044}
/* Welcome */
.welcome{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto}
.welcome .hero-w{background:var(--grad);color:#fff;padding:calc(48px + env(safe-area-inset-top)) 24px 56px;text-align:center;border-radius:0 0 36px 36px;position:relative;overflow:hidden}
.welcome .hero-w::before,.welcome .hero-w::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.10)}
.welcome .hero-w::before{width:220px;height:220px;right:-70px;top:-60px}
.welcome .hero-w::after{width:140px;height:140px;left:-40px;bottom:-50px;background:rgba(255,209,102,.25)}
.biglogo{width:96px;height:96px;border-radius:28px;background:#fff;color:var(--morado);display:grid;place-items:center;margin:0 auto 18px;font-size:40px;font-weight:900;letter-spacing:-1px;box-shadow:0 12px 30px rgba(0,0,0,.18);position:relative;z-index:1}
.biglogo em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome h1{font-size:28px;position:relative;z-index:1}
.welcome p{position:relative;z-index:1}
.slogan{font-weight:700;color:var(--amar)}
.badge{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.badge .bi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--soft);flex:none}
.badge.locked{opacity:.55}
.badge.locked .bi{filter:grayscale(1)}
.list-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.sugg{display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-radius:14px;margin:8px 0;background:var(--card)}
.sugg.out{opacity:.75;border-style:dashed}
.sugg input[type=checkbox]{width:24px;height:24px;accent-color:var(--morado);flex:none;margin-top:2px}
.sugg .mini{display:flex;gap:6px;margin-top:6px}
.sugg .mini input{min-height:38px;padding:6px 8px;font-size:15px;margin:0}
.reason{font-size:12.5px;color:var(--muted);margin-top:3px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
.fade{animation:fadein .22s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.only-print{display:none}
/* Proverbio diario y alarmas */
.ovl{position:fixed;inset:0;z-index:85;background:rgba(22,15,30,.55);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));animation:fadein .2s ease}
.ovl .box{background:var(--card);color:var(--text);border-radius:24px;max-width:440px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.prov-top{background:var(--grad);color:#fff;padding:22px 22px 20px;border-radius:24px 24px 0 0;position:relative;overflow:hidden}
.prov-top::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.10)}
.prov-top small{font-weight:800;letter-spacing:.7px;text-transform:uppercase;font-size:12px;opacity:.92}
.prov-verse{font-family:Georgia,"Times New Roman",serif;font-size:21px;line-height:1.45;margin:12px 0 10px;position:relative;z-index:1;text-wrap:pretty}
.prov-ref{font-weight:800;color:var(--amar);position:relative;z-index:1}
.box .inner{padding:16px 20px 20px}
.prov-card{cursor:pointer;border-left:5px solid var(--dorado)}
.prov-card .q{font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.4;margin:6px 0 4px}
.bell{font-size:52px;display:inline-block;animation:ring 1.2s ease-in-out infinite;transform-origin:50% 10%}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(16deg)}30%{transform:rotate(-14deg)}45%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}75%{transform:rotate(0)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:380px){.quick{grid-template-columns:repeat(3,1fr)}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.hb{grid-template-columns:92px 1fr auto}h1{font-size:23px}}
@media print{
  .top,.nav,.toast,.banner,.noprint,.backdrop,.sheet{display:none!important}
  body{padding:0;background:#fff;color:#000}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .only-print{display:block!important}
  details.tbl{display:block}details.tbl>*{display:block}
}
</style>
</head>
<body>
<div id="banners"></div>
<header class="top">
  <div class="wrap">
    <div class="logo" aria-hidden="true">JC</div>
    <div class="brand"><b>JC — Mi Día en Equilibrio</b><small id="hdrSub">Organiza tu día, cumple tus metas</small></div>
    <span id="savePill" class="savepill ok" role="status" aria-live="polite">Guardado</span>
    <button class="iconbtn" data-act="menu" aria-label="Más opciones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
</header>
<main class="wrap" id="view" tabindex="-1"></main>
<nav class="nav" aria-label="Secciones">
  <div class="wrap" id="navbar"></div>
</nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">JC — Mi Día en Equilibrio necesita JavaScript activado.</p></noscript>

<script>
'use strict';
/* =========================================================
   JC — Mi Día en Equilibrio · v1.1.0
   Arquitectura: una sola página (SPA) + IndexedDB + SVG.
   Capa de datos única (S) → todas las métricas y gráficos
   se calculan desde S, nunca desde valores fijos.
   ========================================================= */
const APP_VERSION = '1.1.0';

/* ---------- Utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);

/* ---------- Capa de almacenamiento: IndexedDB (con respaldo localStorage) ---------- */
const STORES = ['kv', 'activities', 'series', 'goals', 'biz', 'reflections', 'history'];
const KEYP = { kv: 'k', reflections: 'date', history: 'date' };
const DB = {
  mode: 'idb', db: null, mem: {},
  open() {
    return new Promise(res => {
      const fallback = () => { try { localStorage.setItem('__jc', '1'); localStorage.removeItem('__jc'); this.mode = 'ls'; } catch (e) { this.mode = 'mem'; } res(); };
      if (!('indexedDB' in window)) return fallback();
      let req; try { req = indexedDB.open('jc-mi-dia', 1); } catch (e) { return fallback(); }
      req.onupgradeneeded = () => { const db = req.result; STORES.forEach(s => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: KEYP[s] || 'id' }); }); };
      req.onsuccess = () => { this.db = req.result; this.mode = 'idb'; res(); };
      req.onerror = () => fallback();
      req.onblocked = () => fallback();
    });
  },
  _ls() { try { return JSON.parse(localStorage.getItem('jc-mi-dia-db')) || {}; } catch (e) { return {}; } },
  _lsw(o) { localStorage.setItem('jc-mi-dia-db', JSON.stringify(o)); },
  _tx(store, mode, fn) {
    return new Promise((res, rej) => { const tx = this.db.transaction(store, mode); const r = fn(tx.objectStore(store)); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); });
  },
  async getAll(s) {
    if (this.mode === 'idb') return new Promise((res, rej) => { const r = this.db.transaction(s).objectStore(s).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); });
    if (this.mode === 'ls') return Object.values(this._ls()[s] || {});
    return Object.values(this.mem[s] || {});
  },
  async put(s, o) {
    const k = o[KEYP[s] || 'id'];
    if (this.mode === 'idb') return this._tx(s, 'readwrite', st => st.put(o));
    if (this.mode === 'ls') { const all = this._ls(); (all[s] = all[s] || {})[k] = o; this._lsw(all); return; }
    (this.mem[s] = this.mem[s] || {})[k] = o;
  },
  async del(s, k) {
    if (this.mode === 'idb') return this._tx(s, 'readwrite', st => st.delete(k));
    if (this.mode === 'ls') { const all = this._ls(); if (all[s]) delete all[s][k]; this._lsw(all); return; }
    if (this.mem[s]) delete this.mem[s][k];
  },
  async clearAll() {
    if (this.mode === 'idb') { for (const s of STORES) await this._tx(s, 'readwrite', st => st.clear()); return; }
    if (this.mode === 'ls') { localStorage.removeItem('jc-mi-dia-db'); return; }
    this.mem = {};
  }
};
let pendingWrites = 0;
function setSave(state) {
  const p = $('#savePill'); if (!p) return;
  p.className = 'savepill' + (state === 'ok' ? ' ok' : state === 'error' ? ' err' : '');
  p.textContent = state === 'saving' ? 'Guardando…' : state === 'error' ? 'Error al guardar' : (DB.mode === 'mem' ? 'Sin guardado' : 'Guardado');
}
async function persist(fn) {
  pendingWrites++; setSave('saving');
  try { await fn(); pendingWrites--; if (!pendingWrites) setSave('ok'); }
  catch (e) { console.error(e); pendingWrites--; setSave('error'); toast('No se pudo guardar el último cambio. Intenta de nuevo o exporta un respaldo.'); }
}
const clone = o => JSON.parse(JSON.stringify(o));
const put = (s, o) => persist(() => DB.put(s, clone(o)));
const del = (s, k) => persist(() => DB.del(s, k));

/* ---------- Actividades recurrentes ---------- */
function seriesMatches(ser, d) {
  if (d < ser.startDate || (ser.until && d > ser.until)) return false;
  if ((ser.exceptions || []).includes(d)) return false;
  if (ser.freq === 'daily') return true;
  return (ser.weekdays || []).includes(pd(d).getDay());
}
/* Crea las ocurrencias concretas que falten (clave única: seriesId + occDate) → nunca duplica. */
function materialize(from, to) {
  let created = 0;
  for (const ser of S.series) {

      const a = {

/* ---------- Cálculos (reglas documentadas) ----------
   · Válidas = actividades del día excepto Canceladas y Reprogramadas.
   · Reprogramada: no cuenta en el día original; la nueva copia cuenta en su nueva fecha (sin doble conteo).
   · Completada fuera de horario: cuenta como completada en su fecha planificada.
   · Tiempo real: solo actividades completadas con duración real registrada. Si falta, se indica.

  const reprog = acts.filter(a => a.status === 'reprogramada');

  let best = null; withData.forEach(x => { if (!best || x.pct > best.pct) best = x; });

function hbRow(r, maxV) {

/* ---------- Tarjeta de actividad ---------- */
function actCard(a, compact) {
  const c = cat(a.cat), done = a.status === 'completada';
  const confl = conflictsOf(a);
  return `<div class="act${done ? ' done' : ''}" data-act="openAct" data-id="${a.id}" style="${compact ? 'box-shadow:none' : ''}">
    <span class="bar" style="background:${c.color}"></span>
    <div class="body"><div class="ttl">${c.icon} ${esc(a.title)}</div>
      <div class="meta"><span>🕒 ${a.start}–${a.end}${toMin(a.end) <= toMin(a.start) ? ' (+1 día)' : ''}</span><span>· ${fmtDur(a.plannedMin)}</span>${stTag(a.status)}<span class="pr-${a.priority}">${PRIO_L[a.priority]}</span>${a.fixed ? '<span>📌 Fijo</span>' : ''}${a.seriesId ? '<span>🔁</span>' : ''}${a.reminder != null && a.reminder !== '' ? `<span title="Recordatorio ${remLabel(a.reminder)}">🔔 ${remLabel(a.reminder)}</span>` : ''}${a.actualMin != null && a.actualMin !== '' ? `<span>⏱ real ${fmtDur(a.actualMin)}</span>` : ''}</div>
      ${confl.length && !['cancelada', 'reprogramada'].includes(a.status) ? `<div class="meta conf">⚠ Se cruza con: ${confl.map(x => esc(x.title)).join(', ')}</div>` : ''}
    </div>
    ${['pendiente', 'en_curso'].includes(a.status) ? `<div class="acts"><button class="circ" data-act="complete" data-id="${a.id}" aria-label="Marcar como completada">✓</button></div>` : done ? `<div class="acts"><span class="circ ok" aria-hidden="true">✓</span></div>` : ''}
  </div>`;
}
function interval(a, shift = 0) { const s = toMin(a.start); let e = s + (a.plannedMin || durOf(a.start, a.end)); return [s + shift, e + shift]; }
function conflictsOf(a, pool) {
  if (!a.start || !a.end) return [];
  const [s, e] = interval(a);
  const prev = addD(a.date, -1), next = addD(a.date, 1);
  return (pool || S.activities).filter(b => b.id !== a.id && b.status !== 'cancelada' && b.status !== 'reprogramada' && (b.date === a.date || b.date === prev || b.date === next)).filter(b => {
    const [bs, be] = interval(b, b.date === prev ? -1440 : b.date === next ? 1440 : 0);
    return s < be && bs < e;
  });
}

VIEWS.agenda = () => {

  let h = `<div class="daynav"><button class="iconbtn" data-act="day" data-n="-1" aria-label="Día anterior">‹</button><div class="dtitle">${d === today() ? 'Hoy · ' : ''}${fmtMed(d)}</div><button class="iconbtn" data-act="day" data-n="1" aria-label="Día siguiente">›</button></div>
  <div class="row" style="margin:8px 0"><input type="date" value="${d}" data-change="pickDate" aria-label="Elegir fecha" style="margin:0;flex:1">${d !== today() ? '<button class="btn sm ghost" data-act="day" data-n="0">Hoy</button>' : ''}</div>

  <div class="row small muted" style="margin-top:12px"><span style="flex:1">${st.valid.length ? `${st.done.length}/${st.valid.length} completadas · ${fmtPct(st.pct)} · planificado ${fmtDur(st.planned)}` : 'Sin actividades válidas este día'}</span>${st.pending.length ? `<button class="btn sm ghost" data-act="reorg" data-d="${d}">🔄 Reorganizar</button>` : ''}</div>`;
  if (!acts.length) return h + `<div class="card empty"><span class="em">🗓️</span><b>Planifica tu primera actividad</b><div class="small">Añádela manualmente o deja que te sugiera una agenda.</div></div>`;
  h += '<div class="tl">';
  let lastEnd = null;
  acts.forEach(a => {
    const [s, e] = interval(a);
    const counts = a.status !== 'cancelada' && a.status !== 'reprogramada';
    if (counts && lastEnd != null && s - lastEnd >= 20) h += `<div class="gap">🌤 Espacio libre · ${fmtDur(s - lastEnd)} (${toHM(lastEnd)}–${a.start})</div>`;

    if (counts) lastEnd = Math.max(lastEnd ?? 0, e);
  });
  return h + '</div>';
};

function setStatus(a, to, note) {

  a.status = to;
  if (to === 'en_curso') a.startedAt = new Date().toISOString();
  putAct(a);
}

/* ---------- Formulario de actividad ---------- */

    <label>🔔 Recordatorio con alarma<select name="reminder">${REM_OPTS.map(([v, l]) => `<option value="${v}"${String(isNew ? (S.prefs.remDef ?? '') : (a.reminder ?? '')) === v ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
    <label class="check"><input type="checkbox" name="fixed" ${a.fixed ? 'checked' : ''}> 📌 Compromiso fijo (no se mueve al reorganizar)</label>
    ${isNew ? `<label>Repetir<select name="rec" data-change="recToggle"><option value="none">No se repite</option><option value="daily">Todos los días</option><option value="weekly">Semanalmente</option></select></label>
      <div id="recBox" hidden><div class="chips" aria-label="Días">${['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'].map((x, i) => `<label><input type="checkbox" name="wd" value="${i}" ${i === pd(d).getDay() ? 'checked' : ''}><span>${x}</span></label>`).join('')}</div>
      <label>Repetir hasta (opcional)<input type="date" name="until"></label></div>` : ''}

}
function newActSheet(prefill = {}) { openSheet(prefill.title ? 'Duplicar actividad' : 'Nueva actividad', actForm(prefill)); }
async function editAct(id) {
  const a = S.activities.find(x => x.id === id); if (!a) return;
  let scope = '';
  if (a.seriesId && S.series.find(s => s.id === a.seriesId)) {
    scope = await choiceBox('Actividad recurrente', '¿Qué quieres modificar?', [{ label: 'Solo esta ocurrencia', value: 'one', cls: 'primary' }, { label: 'Esta y las siguientes', value: 'future' }]);
    if (!scope) return;
  }
  openSheet('Editar actividad', actForm(a, { scope }));
}
async function submitAct(f) {
  const fd = new FormData(f), id = f.dataset.id, scope = f.dataset.scope;
  const old = id ? S.activities.find(x => x.id === id) : null;
  const title = (fd.get('title') || '').trim();
  const date = fd.get('date') || old?.date, start = fd.get('start'), end = fd.get('end');
  const msg = $('#formMsg', f);
  const err = t => { msg.innerHTML = `<div class="warn">⚠ ${t}</div>`; msg.scrollIntoView({ block: 'center' }); };
  if (!title) return err('Escribe un nombre para la actividad.');
  if (!date || !start || !end) return err('Completa la fecha y las horas.');
  if (start === end) return err('La hora de fin debe ser diferente de la de inicio.');
  const data = { title, cat: fd.get('cat'), priority: fd.get('priority'), date, start, end, plannedMin: durOf(start, end), fixed: !!fd.get('fixed'), reminder: fd.get('reminder') === '' || fd.get('reminder') == null ? null : Number(fd.get('reminder')), goalId: fd.get('goalId') || '', desc: (fd.get('desc') || '').trim(), notes: (fd.get('notes') || '').trim() };
  if (old) { const am = fd.get('actualMin'); data.actualMin = am === '' || am == null ? null : Math.max(0, Math.min(1440, Number(am))); }
  const conf = conflictsOf({ ...data, id: id || '__new' });
  if (conf.length && f.dataset.ok !== '1') {
    msg.innerHTML = `<div class="warn">⚠ Este horario se cruza con: <b>${conf.map(c => `${esc(c.title)} (${c.start}–${c.end})`).join(', ')}</b>.<div class="row" style="margin-top:10px"><button type="button" class="btn sm" data-act="confirmConflict">Guardar de todos modos</button></div></div>`;
    msg.scrollIntoView({ block: 'center' }); return;
  }
  const nowIso = new Date().toISOString();
  if (!old) {
    const rec = fd.get('rec');
    if (rec && rec !== 'none') {
      const wds = fd.getAll('wd').map(Number);
      if (rec === 'weekly' && !wds.length) return err('Elige al menos un día de la semana.');
      const until = fd.get('until') || null;
      if (until && until < date) return err('La fecha "hasta" no puede ser anterior a la fecha de inicio.');
      const ser = { id: uid(), ...data, freq: rec, weekdays: rec === 'weekly' ? wds : [], startDate: date, until, exceptions: [], createdAt: nowIso };
      delete ser.date; S.series.push(ser); put('series', ser);
      materialize(date, UI.date > date ? UI.date : date);
      toast('Actividad recurrente creada 🔁');
    } else {
      const a = { id: uid(), ...data, actualMin: null, status: 'pendiente', createdAt: nowIso, history: [{ at: nowIso, to: 'pendiente', note: 'Creada' }] };
      S.activities.push(a); putAct(a); toast('Actividad guardada ✓');
    }
  } else if (scope === 'future') {
    const ser = S.series.find(s => s.id === old.seriesId);
    const from = old.occDate || old.date;
    const newSer = { ...clone(ser), id: uid(), title: data.title, cat: data.cat, priority: data.priority, start, end, plannedMin: data.plannedMin, fixed: data.fixed, reminder: data.reminder, goalId: data.goalId, desc: data.desc, notes: data.notes, startDate: from, exceptions: [], createdAt: nowIso };
    ser.until = addD(from, -1);
    // Elimina ocurrencias futuras pendientes y no modificadas de la serie anterior (evita duplicados)
    S.activities.filter(a => a.seriesId === ser.id && (a.occDate || a.date) >= from && a.status === 'pendiente' && !a.detached).forEach(a => { S.activities.splice(S.activities.indexOf(a), 1); del('activities', a.id); });
    if (ser.until < ser.startDate) { S.series.splice(S.series.indexOf(ser), 1); del('series', ser.id); } else put('series', ser);
    S.series.push(newSer); put('series', newSer);
    materialize(from, UI.date > from ? UI.date : from);
    // Si la ocurrencia editada no era pendiente (p. ej. completada), aplica también los cambios en ella
    const still = S.activities.find(x => x.id === old.id); if (still) { Object.assign(still, data); putAct(still); }
    toast('Cambios aplicados a esta y las siguientes');
  } else {
    const prevStatus = old.status, newStatus = fd.get('status') || old.status;
    resetAlarm(old.id);
    const oldDate = old.date;
    Object.assign(old, data);
    if (oldDate !== date) snapshot(oldDate);
    if (old.seriesId) old.detached = true;
    if (newStatus !== prevStatus) setStatus(old, newStatus, 'Cambio manual'); else { (old.history = old.history || []).push({ at: nowIso, note: 'Editada' }); putAct(old); }
    toast('Cambios guardados ✓');
  }
  closeSheet(); rerender(); checkBadges();
}

/* ---------- Completar / reprogramar / cancelar / eliminar ---------- */
function completeSheet(id) {

  const g = S.goals.find(x => x.id === a.goalId && x.type === 'numerica');
  openSheet('¡Bien hecho! ✓', `<p><b>${esc(a.title)}</b></p>
    <form data-form="complete" data-id="${a.id}">
      <label>¿Cuánto tiempo te tomó realmente? (min)<input type="number" name="actualMin" min="0" max="1440" inputmode="numeric" value="${elapsed ?? ''}" placeholder="Opcional · previsto ${a.plannedMin} min"></label>
      <div class="row wrapr" style="margin-top:8px">${[...new Set([a.plannedMin, 15, 30, 45, 60])].filter(Boolean).map(m => `<button type="button" class="btn sm ghost" data-act="setMin" data-m="${m}">${m === a.plannedMin ? 'Lo previsto · ' : ''}${fmtDur(m)}</button>`).join('')}</div>

      ${g ? `<label class="check"><input type="checkbox" name="goalInc" checked> Sumar <input type="number" name="goalAmt" value="1" min="0" step="any" style="width:80px;display:inline-block;margin:0 6px;min-height:38px;padding:6px"> ${esc(g.unit || '')} a la meta «${esc(g.name)}»</label>` : ''}
      <button class="btn primary big" style="margin-top:16px">Marcar como completada</button>
    </form>`);
}
function submitComplete(f) {
  const a = S.activities.find(x => x.id === f.dataset.id); if (!a) return;
  const fd = new FormData(f); const am = fd.get('actualMin');
  a.actualMin = am === '' || am == null ? null : Math.max(0, Math.min(1440, Number(am)));
  const late = a.date === today() && nowMin() > toMin(a.start) + a.plannedMin;
  setStatus(a, 'completada', late ? 'Completada después de su horario' : '');
  if (fd.get('goalInc')) { const g = S.goals.find(x => x.id === a.goalId); if (g) goalAdd(g, Number(fd.get('goalAmt')) || 0, 'Desde actividad: ' + a.title); }
  closeSheet(); rerender();
  const st = dayStats(a.date);
  if (st.pct === 100 && st.valid.length >= 2) { celebrate(); toast('¡Completaste todo lo planificado! 🎉'); } else toast('Actividad completada ✓');
  checkBadges();
}
function rescheduleSheet(id) {

function submitResched(f) {

  if (ser) { scope = await choiceBox('Eliminar actividad recurrente', '¿Qué quieres eliminar?', [{ label: 'Solo esta ocurrencia', value: 'one', cls: 'danger' }, { label: 'Esta y las siguientes', value: 'future', cls: 'danger' }]); if (!scope) return; }
  else if (!(await confirmBox(`¿Eliminar «${esc(a.title)}»? Esta acción no se puede deshacer.`, 'Eliminar'))) return;
  const rm = x => { const i = S.activities.indexOf(x); if (i >= 0) S.activities.splice(i, 1); del('activities', x.id); };

/* ---------- Reorganización inteligente (requiere aprobación) ---------- */
let reorgState = null;
function reorgSheet(date) {
  const d = date || today();
  const isToday = d === today();
  const ws = isToday ? ceil5(nowMin()) : toMin(S.profile?.dayStart || '08:00');
  let we = toMin(S.profile?.dayEnd || '21:00'); if (we <= ws) we = ws;
  const acts = dayActs(d).filter(a => a.status !== 'cancelada' && a.status !== 'reprogramada');
  const movable = acts.filter(a => a.status === 'pendiente' && !a.fixed);
  const busy = acts.filter(a => !movable.includes(a) && a.status !== 'completada').map(a => interval(a));
  if (!movable.length) { openSheet('Reorganizar mi día', `<div class="empty"><span class="em">👌</span>No hay actividades pendientes que se puedan mover. Los compromisos fijos (📌) y las completadas no se mueven.</div>`); return; }
  const order = movable.slice().sort((a, b) => PRIO[a.priority] - PRIO[b.priority] || toMin(a.start) - toMin(b.start));
  const plan = [];
  order.forEach(a => {
    const st = findSlot(busy, a.plannedMin, ws, we);
    if (st == null) plan.push({ a, fit: false });
    else { busy.push([st, st + a.plannedMin + 10]); plan.push({ a, fit: true, ns: st }); }
  });

  const changed = plan.filter(p => p.fit && toHM(p.ns) !== p.a.start);
  openSheet('Reorganizar mi día', `
    <div class="info">Reorganizo las actividades pendientes desde las <b>${toHM(ws)}</b> hasta las <b>${toHM(we)}</b>, por prioridad, con pausas de 10 min. Los compromisos fijos 📌 se respetan. <b>No se cambia nada hasta que lo apruebes.</b></div>
    <h3 style="margin-top:14px">Nueva distribución</h3>
    ${plan.filter(p => p.fit).map(p => `<div class="list-item"><span class="dot" style="background:${cat(p.a.cat).color}"></span><div style="flex:1"><b>${esc(p.a.title)}</b><div class="small muted">${p.a.start} → <b style="color:var(--text)">${toHM(p.ns)}–${toHM(p.ns + p.a.plannedMin)}</b> ${toHM(p.ns) === p.a.start ? '(sin cambios)' : ''}</div></div><span class="small pr-${p.a.priority}">${PRIO_L[p.a.priority]}</span></div>`).join('') || '<p class="muted small">Ninguna cabe en el tiempo restante.</p>'}

      <select data-alt="${p.a.id}" aria-label="Alternativa para ${esc(p.a.title)}" style="margin-top:8px">
        <option value="manana">↪ Reprogramar para mañana</option><option value="reducir">✂️ Reducir la duración estimada</option><option value="dividir">🧩 Dividir en dos pasos</option><option value="noprio">▽ Marcar como no prioritaria (queda pendiente)</option><option value="cancelar">✕ Cancelar (confirmaré antes)</option></select></div>`).join('')}` : ''}
    <div class="grid2" style="margin-top:16px"><button class="btn ghost" data-act="closeSheet">No cambiar</button><button class="btn primary" data-act="reorgApply">Aplicar cambios</button></div>

async function reorgApply() {
  if (!reorgState) return; const { plan, date } = reorgState; const nowIso = new Date().toISOString();
  const alts = {}; $$('[data-alt]').forEach(s => alts[s.dataset.alt] = s.value);
  if (Object.values(alts).includes('cancelar') && !(await confirmBox('Algunas actividades se cancelarán. ¿Confirmas?', 'Sí, cancelar'))) return;
  const tomorrow = addD(date, 1);
  const moveTomorrow = (a, title, dur) => {
    const n = { ...clone(a), id: uid(), title: title || a.title, date: tomorrow, plannedMin: dur || a.plannedMin, end: toHM(toMin(a.start) + (dur || a.plannedMin)), status: 'pendiente', actualMin: null, rescheduledFrom: a.id, createdAt: nowIso, history: [{ at: nowIso, to: 'pendiente', note: 'Reprogramada desde ' + fmtShort(date) }] };

      const want = alt === 'reducir' ? a.plannedMin : half;
      let fitDur = 0, st = null; for (let d = want; d >= 15; d -= 5) { st = findSlot(reorgState.busy, d, reorgState.ws, reorgState.we); if (st != null) { fitDur = d; break; } }
      if (alt === 'reducir') {
        if (st != null) { reorgState.busy.push([st, st + fitDur + 10]); a.history.push({ at: nowIso, note: `Duración reducida ${a.plannedMin}→${fitDur} min` }); Object.assign(a, { start: toHM(st), end: toHM(st + fitDur), plannedMin: fitDur }); putAct(a); }
        else { const n = moveTomorrow(a); a.rescheduledTo = n.id; setStatus(a, 'reprogramada', 'Sin espacio hoy: a mañana'); }
      } else {
        const rest = a.plannedMin - (st != null ? fitDur : 0);
        if (st != null) { reorgState.busy.push([st, st + fitDur + 10]); a.history.push({ at: nowIso, note: 'Dividida en pasos' }); Object.assign(a, { title: a.title + ' (paso 1)', start: toHM(st), end: toHM(st + fitDur), plannedMin: fitDur }); putAct(a); moveTomorrow({ ...a, start: a.start }, a.title.replace(' (paso 1)', '') + ' (paso 2)', rest); }

      }

    else if (alt === 'cancelar') setStatus(a, 'cancelada', 'Cancelada al reorganizar');
  });
  closeSheet(); UI.date = date; go('agenda'); toast('Tu día quedó reorganizado ✓');
}

VIEWS.progreso = () => {
  const t = today(), n = UI.period, from = addD(t, -(n - 1));
  materialize(from, t);
  const r = rangeStats(from, t), prev = rangeStats(addD(from, -n), addD(from, -1));
  const td = dayStats(t);
  const items = r.days.map(x => ({ l: n <= 7 ? wd(x.d) : String(pd(x.d).getDate()), full: fmtMed(x.d), v: x.pct }));
  const canCmp = r.withData.length >= 3 && prev.withData.length >= 3;
  const tb = timeByCat(from, t); const tbUsed = tb.filter(x => x.planned || x.real);
  const maxT = Math.max(1, ...tbUsed.map(x => Math.max(x.planned, x.real)));

function balanceCard(from, to) {

function submitRefl(f) {

   INFORMES SEMANALES Y MENSUALES

function repRange() {
  const { type, offset } = UI.rep; const t = today();
  if (type === 'semana') { const ws = addD(weekStart(t), 7 * offset); const we = addD(ws, 6); return { from: ws, to: we > t ? t : we, label: `Semana del ${fmtShort(ws)} al ${fmtShort(addD(ws, 6))}` }; }
  const ref = pd(t); ref.setMonth(ref.getMonth() + offset, 1); const ms = ds(ref), me = monthEnd(ms);
  return { from: ms, to: me > t ? t : me, label: cap(new Intl.DateTimeFormat('es', { month: 'long', year: 'numeric' }).format(ref)) };
}
function buildReport() {
  const { from, to, label } = repRange(); const cf = UI.rep.cat;
  if (to < from) return { from, to, label, empty: true };
  materialize(from, to);
  const r = rangeStats(from, to, cf); const tb = timeByCat(from, to).filter(x => (!cf || x.cat.id === cf) && (x.planned || x.real));
  const acts = S.activities.filter(a => a.date >= from && a.date <= to && (!cf || a.cat === cf));
  const rp = {}; acts.filter(a => a.status === 'reprogramada').forEach(a => rp[a.title] = (rp[a.title] || 0) + 1);
  const freqR = Object.entries(rp).filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1]);
  const biz = bizSum(from, to);
  const goalsEvo = S.goals.filter(g => (!cf || g.cat === cf) && (g.log || []).some(l => { const d = l.date || l.at.slice(0, 10); return d >= from && d <= to; }));
  const goalsDone = S.goals.filter(g => goalInfo(g).done && (!cf || g.cat === cf) && (g.completedAt ? g.completedAt >= from && g.completedAt <= to : true));
  const highs = acts.filter(a => a.status === 'completada' && a.priority === 'alta');
  const attention = [];
  S.goals.filter(g => ['vencida', 'proxima'].includes(goalInfo(g).state)).forEach(g => attention.push(`Meta «${g.name}»: ${goalInfo(g).label.replace(/^\S+\s/, '').toLowerCase()}`));
  freqR.forEach(([t, n]) => attention.push(`«${t}» se reprogramó ${n} veces`));
  if (r.missingReal) attention.push(`${r.missingReal} actividad(es) completada(s) sin duración real registrada`);
  const recs = [];
  if (r.withData.length >= 2) {
    if (freqR.length) recs.push(`Divide «${freqR[0][0]}» en pasos más pequeños o asígnale un horario con más margen.`);
    if (r.avg != null && r.avg < 50) recs.push('Prueba planificar menos actividades por día y dejar más margen para imprevistos.');
    if (r.avg != null && r.avg >= 85) recs.push('Tu planificación se ajusta bien a tu ritmo: mantenla y celebra tus avances.');
    const best = tb.slice().sort((a, b) => b.real - a.real)[0]; if (best && best.real) recs.push(`El área con más tiempo real fue ${best.cat.name}. Revisa si coincide con tus prioridades.`);
    if (bizUsed() && biz.prospecto.n && !biz.seguimiento.n) recs.push('Contactaste prospectos pero no registraste seguimientos: agenda un bloque para darles continuidad.');
  }
  return { from, to, label, r, tb, acts, freqR, biz, goalsEvo, goalsDone, highs, attention, recs, cf };
}

function exportCSV() {

  const rows = [['JC — Mi Día en Equilibrio', R.label], [], ['Resumen'], ['Cumplimiento promedio (%)', R.r.avg == null ? 'Sin registro' : Math.round(R.r.avg)], ['Días con registro', R.r.withData.length], ['Completadas', R.r.done], ['Válidas', R.r.valid], ['Reprogramadas', R.r.reprog], ['Canceladas', R.r.canc], ['Tiempo planificado (min)', R.r.planned], ['Tiempo real registrado (min)', R.r.real], [],
    ['Cumplimiento diario'], ['Fecha', 'Cumplimiento (%)', 'Completadas', 'Válidas'], ...R.r.days.map(x => [x.d, x.pct == null ? 'Sin registro' : Math.round(x.pct), x.done.length, x.valid.length]), [],
    ['Tiempo por categoría'], ['Categoría', 'Planificado (min)', 'Real (min)'], ...R.tb.map(x => [x.cat.name, x.planned, x.real]), [],
    ['Actividades'], ['Fecha', 'Inicio', 'Fin', 'Actividad', 'Categoría', 'Prioridad', 'Estado', 'Prevista (min)', 'Real (min)'], ...R.acts.sort((a, b) => (a.date + a.start) < (b.date + b.start) ? -1 : 1).map(a => [a.date, a.start, a.end, a.title, cat(a.cat).name, a.priority, ST[a.status].l, a.plannedMin, a.actualMin ?? '']), []];
  if (bizUsed()) rows.push(['Emprendimiento'], ['Tipo', 'Cantidad', 'Monto'], ...Object.entries(BIZ_TYPES).map(([k, v]) => [v.s, R.biz[k].n, R.biz[k].amt]), ['Ingreso neto estimado', '', R.biz.neto]);
  const csv = '﻿' + rows.map(r => r.map(q).join(';')).join('\r\n');

function download(fname, content, type) {
  const blob = new Blob([content], { type }); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function validateBackup(o) {
  if (!o || o.app !== 'jc-mi-dia' || typeof o.data !== 'object') return 'El archivo no es un respaldo de JC — Mi Día.';
  const d = o.data; const arr = k => d[k] == null || Array.isArray(d[k]);
  if (!['activities', 'series', 'goals', 'biz', 'reflections'].every(arr)) return 'El respaldo está incompleto o dañado.';
  const okDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
  if ((d.activities || []).some(a => !a || typeof a.id !== 'string' || typeof a.title !== 'string' || !okDate(a.date) || !ST[a.status] || toMin(a.start) == null)) return 'Hay actividades con datos no válidos.';
  if ((d.goals || []).some(g => !g || typeof g.id !== 'string' || typeof g.name !== 'string')) return 'Hay metas con datos no válidos.';
  if ((d.biz || []).some(b => !b || typeof b.id !== 'string' || !BIZ_TYPES[b.type] || !okDate(b.date))) return 'Hay registros comerciales no válidos.';
  if ((d.series || []).some(s => !s || typeof s.id !== 'string' || !okDate(s.startDate))) return 'Hay actividades recurrentes no válidas.';
  return null;
}
async function importJSON(file) {
  if (!file) return; let o;
  try { o = JSON.parse(await file.text()); } catch (e) { return toast('No se pudo leer el archivo: no es un JSON válido.'); }
  const err = validateBackup(o); if (err) return toast(err);
  const d = o.data;
  if (!(await confirmBox(`Se reemplazarán los datos actuales por el respaldo del ${o.exportedAt ? new Date(o.exportedAt).toLocaleDateString('es') : '—'} (${(d.activities || []).length} actividades, ${(d.goals || []).length} metas). ¿Continuar?`, 'Importar', false))) return;
  await DB.clearAll();
  Object.assign(S, { profile: d.profile || S.profile, prefs: Object.assign({ theme: 'auto', currency: '$', gamification: true, biz: {}, balance: {} }, d.prefs || {}), cats: d.cats || clone(DEFAULT_CATS), dayGoals: d.dayGoals || {}, library: d.library || clone(DEFAULT_LIBRARY), activities: d.activities || [], series: d.series || [], goals: d.goals || [], biz: d.biz || [], refl: {} });
  (d.reflections || []).forEach(r => { if (r && r.date) S.refl[r.date] = r; });
  normPrefs();
  await persistAll(); applyTheme(); toast('Respaldo importado ✓'); go('hoy');
}
async function persistAll() {
  await persist(async () => {
    for (const k of ['profile', 'prefs', 'cats', 'dayGoals', 'library']) if (S[k] != null) await DB.put('kv', clone({ k, v: S[k] }));
    for (const a of S.activities) await DB.put('activities', clone(a));
    for (const s of S.series) await DB.put('series', clone(s));
    for (const g of S.goals) await DB.put('goals', clone(g));
    for (const b of S.biz) await DB.put('biz', clone(b));
    for (const r of Object.values(S.refl)) await DB.put('reflections', clone(r));
  });
}

  S.goals.push(goal1, goal2);
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;

    const d = addD(t, -i); if (i % 6 === 3) continue; // días sin registro
    tpl.forEach(([title, c, s, e, p], j) => {

      if (isToday && j > 3) status = 'pendiente';
      const pm = durOf(s, e);
      const a = { id: uid(), title, cat: c, priority: p, date: d, start: s, end: e, plannedMin: pm, actualMin: status === 'completada' && rnd() > .15 ? Math.max(5, Math.round(pm * (.7 + rnd() * .6) / 5) * 5) : null, status, fixed: c === 'familia', goalId: title === 'Contactar prospectos' ? goal1.id : '', desc: '', notes: '', createdAt: nowIso, history: [{ at: nowIso, to: status, note: 'Demostración' }], demo: true };
      S.activities.push(a);

  }
  ['prospecto', 'prospecto', 'seguimiento', 'cotizacion', 'pedido', 'venta', 'ingreso', 'gasto', 'prospecto', 'seguimiento', 'venta', 'ingreso'].forEach((k, i) => S.biz.push({ id: uid(), type: k, date: addD(t, -Math.floor(i * 1.1)), ref: 'Cliente de ejemplo', amount: BIZ_TYPES[k].money ? [0, 0, 0, 120, 80, 150, 150, 40, 0, 0, 90, 90][i] || 50 : null, note: 'Demostración', createdAt: nowIso, demo: true }));
  goal1.current = S.biz.filter(b => b.demo && b.type === 'prospecto').length + 9; goal1.log = [{ at: nowIso, date: addD(t, -3), value: 6, note: 'Demostración' }, { at: nowIso, date: t, value: goal1.current, note: 'Demostración' }];

  if (!S.prefs.alarmSound) return; const c = audio(); if (!c) return;

  notes.forEach((f, i) => { const o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.value = f; const t = c.currentTime + i * .22; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.22, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + .55); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + .6); });
}
const vib = p => { try { if (S.prefs.alarmSound && navigator.vibrate) navigator.vibrate(p); } catch (e) { } };
function startRing() { stopRing(); let n = 0; const f = () => { chime('alarm'); vib([300, 150, 300]); if (++n < 30) ringT = setTimeout(f, 2000); }; f(); }
function stopRing() { clearTimeout(ringT); ringT = null; try { navigator.vibrate && navigator.vibrate(0); } catch (e) { } }
function notifState() { if (!('Notification' in window)) return '🔕 Notificaciones no disponibles aquí'; return Notification.permission === 'granted' ? '🔔 Notificaciones activadas' : Notification.permission === 'denied' ? '🔕 Notificaciones bloqueadas' : '🔔 Activar notificaciones'; }
async function notify(title, body, tag) {
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted') return false;
    const opts = { body, icon: 'icon-192.png', badge: 'icon-192.png', tag, renotify: true, requireInteraction: true, vibrate: [300, 150, 300] };
    const reg = UI.swReg || (navigator.serviceWorker && await navigator.serviceWorker.getRegistration());

}
function openOvl(id, html, role = 'dialog') { closeOvl(id); const o = document.createElement('div'); o.className = 'ovl'; o.id = id; o.setAttribute('role', role); o.setAttribute('aria-modal', 'true'); o.innerHTML = `<div class="box">${html}</div>`; document.body.appendChild(o); setTimeout(() => o.querySelector('button')?.focus(), 60); return o; }
function closeOvl(id) { const o = document.getElementById(id); if (o) o.remove(); }
function showProverb(d = today(), off = 0) {
  const i = provIndex(d, off), pv = PROVERBS[i];
  const tm = S.prefs.proverb;
  openOvl('ovlProv', `<div class="prov-top"><small>📖 Proverbio del día${off ? ' · otro proverbio' : ''}</small><div class="prov-verse">«${esc(pv.t)}»</div><div class="prov-ref">${esc(pv.r)}</div></div>
    <div class="inner"><p style="margin:0"><b>Para hoy:</b> ${esc(pv.h)}</p>
    <p class="hint">Reina-Valera 1909 · ${tm.enabled ? `Programado cada día a las ${esc(tm.time)}` : 'Proverbio diario desactivado'}</p>
    <button class="btn primary big" style="margin-top:12px" data-act="provClose">Amén 💜</button>
    <div class="grid3" style="margin-top:8px"><button class="btn sm ghost" data-act="provNext" data-o="${off}">Otro</button><button class="btn sm ghost" data-act="provCopy" data-i="${i}">Copiar</button><button class="btn sm ghost" data-act="provSchedule">⏰ Hora</button></div></div>`);
}
function openAlarm(a) {
  const c = cat(a.cat), nm = nowMin(), st = toMin(a.start), diff = st - nm;
  const when = a.test ? 'Así sonará tu recordatorio' : diff > 0 ? `Empieza en ${fmtDur(diff)} · ${a.start}–${a.end}` : diff === 0 ? `Empieza ahora · ${a.start}–${a.end}` : `Empezó a las ${a.start} · termina ${a.end}`;
  openOvl('alarm-' + a.id, `<div class="inner" style="text-align:center;padding-top:22px"><div class="bell" aria-hidden="true">🔔</div>
    <div class="small" style="font-weight:800;letter-spacing:.6px;color:var(--morado);margin-top:6px">RECORDATORIO</div>
    <h2 style="margin:6px 0 4px">${c.icon} ${esc(a.title)}</h2><p class="muted" style="margin:0">${esc(when)}</p>
    <div style="display:grid;gap:8px;margin-top:16px">${a.test || a.status !== 'pendiente' ? '' : `<button class="btn primary big" data-act="alarmStart" data-id="${a.id}">▶ Empezar ahora</button>`}
    <div class="grid2"><button class="btn ghost" data-act="alarmSnooze" data-id="${a.id}">⏰ En 5 min</button><button class="btn ghost" data-act="alarmOk" data-id="${a.id}">Entendido</button></div></div></div>`, 'alertdialog');
}
function resetAlarm(id) { if (S.alarms.fired[id] || S.alarms.snooze[id]) { delete S.alarms.fired[id]; delete S.alarms.snooze[id]; saveKV('alarms'); } }
function tick() {
  if (!S.profile || $('.welcome')) return;
  const t = today(); let dirty = false;
  if (S.alarms.date !== t) { S.alarms = { date: t, fired: {}, snooze: {} }; dirty = true; }
  const nm = nowMin(), visible = document.visibilityState === 'visible';
  // Proverbio diario
  const P = S.prefs.proverb;
  if (P.enabled && S.alarms.fired.prov !== 1 && nm >= (toMin(P.time) ?? 420)) {
    if (visible && !$('.sheet') && !$('.ovl')) { S.alarms.fired.prov = 1; dirty = true; chime('soft'); vib(200); showProverb(); }
    else if (!visible && !S.alarms.fired.provN) { S.alarms.fired.provN = 1; dirty = true; const pv = PROVERBS[provIndex(t)]; notify('📖 Proverbio del día', `«${pv.t}» ${pv.r}`, 'jc-prov'); }
  }
  // Recordatorios de actividades
  materialize(t, t);
  dayActs(t).forEach(a => {
    if (!['pendiente', 'en_curso'].includes(a.status) || a.reminder == null || a.reminder === '') return;
    if (S.alarms.fired[a.id] === 1 || document.getElementById('alarm-' + a.id)) return;
    const st = toMin(a.start), sn = S.alarms.snooze[a.id];
    const due = sn ? Date.now() >= sn : nm >= st - Number(a.reminder);
    if (!due || nm >= st + (a.plannedMin || 0)) return;
    S.alarms.fired[a.id] = 1; delete S.alarms.snooze[a.id]; dirty = true;
    openAlarm(a); startRing();
    if (!visible) notify(`🔔 ${a.title}`, `${a.start}–${a.end} · ${cat(a.cat).name}`, 'jc-' + a.id);
  });

}
/* Exportación al calendario del teléfono (.ics con alarma) */
const icsDT = (d, hm) => d.replace(/-/g, '') + 'T' + hm.replace(':', '') + '00';
const icsEsc = s => String(s ?? '').replace(/\\/g, '\\\\').replace(/;/g, '\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
function icsFold(line) {
  const enc = new TextEncoder(); const out = []; let cur = '', bytes = 0;
  for (const ch of line) { const b = enc.encode(ch).length; if (bytes + b > (out.length ? 73 : 74)) { out.push(cur); cur = ''; bytes = 0; } cur += ch; bytes += b; }
  out.push(cur); return out.join('\r\n ');
}
function icsEvent({ uid: id, date, start, end, summary, desc, alarm, rrule }) {
  const endDate = toMin(end) <= toMin(start) ? addD(date, 1) : date;
  const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  const trig = Number(alarm) > 0 ? `-PT${Number(alarm)}M` : 'PT0M';
  return ['BEGIN:VEVENT', `UID:${id}@jc-mi-dia`, `DTSTAMP:${stamp}`, `DTSTART:${icsDT(date, start)}`, `DTEND:${icsDT(endDate, end)}`, `SUMMARY:${icsEsc(summary)}`, desc ? `DESCRIPTION:${icsEsc(desc)}` : null, rrule ? `RRULE:${rrule}` : null,
    'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(summary)}`, `TRIGGER:${trig}`, 'END:VALARM', 'END:VEVENT'].filter(Boolean);
}
function icsFile(events) { return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//JC Mi Dia en Equilibrio//ES', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:JC Mi Día', ...events.flat(), 'END:VCALENDAR'].map(icsFold).join('\r\n') + '\r\n'; }
function exportIcsActs(acts, fname) {
  const ev = acts.map(a => {
    let rrule = null; const ser = a.seriesId && S.series.find(s => s.id === a.seriesId);
    if (ser) { const BY = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA']; rrule = ser.freq === 'daily' ? 'FREQ=DAILY' : `FREQ=WEEKLY;BYDAY=${(ser.weekdays || []).map(i => BY[i]).join(',')}`; if (ser.until) rrule += `;UNTIL=${ser.until.replace(/-/g, '')}T235959`; }
    return icsEvent({ uid: (ser ? ser.id + '-' + a.date : a.id), date: a.date, start: a.start, end: a.end, summary: `${cat(a.cat).icon} ${a.title}`, desc: [a.desc, a.notes, 'JC — Mi Día en Equilibrio'].filter(Boolean).join('\n'), alarm: a.reminder ?? 0, rrule });
  });
  download(fname, icsFile(ev), 'text/calendar;charset=utf-8'); toast('Archivo de calendario descargado 📅');
}
function exportIcsProverbs() {
  const t = today(), tm = S.prefs.proverb.time || '07:00';
  const ev = rangeDays(t, addD(t, 29)).map(d => { const pv = PROVERBS[provIndex(d)]; return icsEvent({ uid: 'prov-' + d, date: d, start: tm, end: toHM(toMin(tm) + 10), summary: '📖 Proverbio del día', desc: `«${pv.t}»\n${pv.r} (Reina-Valera 1909)\n\nPara hoy: ${pv.h}`, alarm: 0 }); });
  download(`jc-proverbios-${t}.ics`, icsFile(ev), 'text/calendar;charset=utf-8'); toast('Proverbios de 30 días listos para tu calendario 📅');
}

/* ---------- Service worker: actualización controlada ---------- */
function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  const ok = location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname);
  if (!ok) return;
  navigator.serviceWorker.register('sw.js').then(reg => {
    UI.swReg = reg;
    const notify = () => toast('Hay una nueva versión de JC Mi Día', { act: 'update', label: 'Actualizar' });
    if (reg.waiting && navigator.serviceWorker.controller) notify();
    reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) notify(); }); });
    setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
  }).catch(err => console.warn('SW no registrado:', err));
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded) return; reloaded = true; location.reload(); });
}
