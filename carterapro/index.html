<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CarteraPro</title>
  <meta name="description" content="Administra tus clientes, créditos y pagos desde un solo lugar.">
  <meta name="theme-color" content="#0E7C66">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CarteraPro">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <aside class="lateral" aria-label="Navegación principal">
    <div class="marca">
      <span class="marca-logo" aria-hidden="true">C</span>
      <span class="marca-texto"><strong>CarteraPro</strong><small id="nombre-negocio"></small></span>
    </div>
    <nav class="lateral-nav" id="nav-lateral"></nav>
  </aside>

  <div class="principal">
    <header class="barra-sup">
      <span class="barra-marca"><span class="marca-logo" aria-hidden="true">C</span><strong>CarteraPro</strong></span>
      <span class="barra-espacio"></span>
      <span class="indicador-offline" role="status">Sin conexión</span>
      <a class="btn-icono" href="#/buscar" id="btn-buscar" aria-label="Buscar" title="Buscar"></a>
      <button type="button" class="btn-icono" id="btn-ocultar" aria-pressed="false" title="Ocultar valores"></button>
    </header>
    <main id="contenido" class="contenido" tabindex="-1">
      <div class="cargando" aria-busy="true">Cargando…</div>
    </main>
  </div>

  <nav class="nav-inferior" id="nav-inferior" aria-label="Navegación principal"></nav>

  <noscript><p class="noscript">CarteraPro necesita JavaScript activado.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
