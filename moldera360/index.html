    const N = pl.pages.length;
    $('#pageCount').textContent = `${N} hoja(s) · ${pl.pw} × ${pl.ph} mm`;
    if (!N){ box.innerHTML = `<div class="muted">Selecciona al menos una pieza.</div>`; return; }
    const lim = 40;
    box.innerHTML = pl.pages.slice(0, lim).map((pg, i) => `<div><div class="sheet-prev">${Print.sheet(pl, pg, i + 1, N, S.design, true)}</div><div class="sheet-cap">Hoja ${i + 1}${pg.type === 'tile' ? ' · ' + esc(pg.pc.code) : pg.type === 'calib' ? ' · calibración' : ''}</div></div>`).join('') + (N > lim ? `<div class="muted">… y ${N - lim} hojas más</div>` : '');

  doPrint(){

    if (S.res.status !== 'VALIDADO') this.toast('Atención: el diseño tiene observaciones. Revisión recomendada antes de fabricar.');
    const N = pl.pages.length;
    const html = pl.pages.map((pg, i) => `<div class="sheet" style="width:${pl.pw}mm;height:${fx(pl.ph - 0.4)}mm">${Print.sheet(pl, pg, i + 1, N, S.design, false)}</div>`).join('');

        <label class="fld"><span>Margen de costura predeterminado</span>${sel('margin', [[3, '3 mm'], [5, '5 mm'], [7, '7 mm'], [10, '10 mm']])}</label></div>
        <div class="pgroup"><h4>Impresión</h4>
        <div class="two"><label class="fld"><span>Papel</span>${sel('paper', [['A4', 'A4'], ['A3', 'A3'], ['Carta', 'Carta'], ['Oficio', 'Oficio'], ['Personalizado', 'Personalizado']])}</label><label class="fld"><span>Orientación</span>${sel('orientation', [['portrait', 'Vertical'], ['landscape', 'Horizontal']])}</label></div>
        <div class="two"><label class="fld"><span>Margen impresora (mm)</span><input type="number" class="inp" data-set="printMargin" value="${s.printMargin}"></label><label class="fld"><span>Solape mosaico (mm)</span><input type="number" class="inp" data-set="overlap" value="${s.overlap}"></label></div>
        <div class="two"><label class="fld"><span>Papel personalizado ancho</span><input type="number" class="inp" data-set="customW" value="${s.customW}"></label><label class="fld"><span>alto (mm)</span><input type="number" class="inp" data-set="customH" value="${s.customH}"></label></div></div>
        <button class="btn primary" data-act="saveSettings">Guardar configuración</button></div></div></div>`;
  },
  /* -------- acciones de diseño -------- */
  open(d){ S.design = Util.clone(d); S.res = Engine.run(S.design); S.tab = 'diseno'; S.dirty = false; S.sel = null; S.vb = null; S.printSel = null; S.printCfg = null; S.unit = Store.settings().unit; this.go('editor'); },
  regen(){ S.res = Engine.run(S.design); },
  changed(rerenderForm){
    S.dirty = true; this.regen();
    if (rerenderForm){ const f = $('#paramForm'); if (f) f.innerHTML = this.form(); }
    this.refreshLive();
  },
  save(){
    const d = S.design; d.fechaActualizacion = Util.now(); d.piezas = S.res.pieces;
    if (Store.saveDesign(Util.clone(d))){ S.dirty = false; this.refreshLive(); this.toast('Diseño guardado ✔', 'ok'); }
  },
  applyAI(res, toCurrent){
    if (toCurrent && S.design){ Object.assign(S.design.parametros, res.cambios); S.dirty = true; this.regen(); return; }
    const cat = res.categoriaEfectiva; if (!cat) return;
    const d = newDesign(cat); d.codigo = nextCode(cat); Object.assign(d.parametros, res.cambios); d.nombre = `${PRODUCTS[cat].label} IA ${d.codigo.slice(-3)}`;
    S.design = d; S.res = Engine.run(d); S.dirty = true; S.tab = 'diseno'; S.sel = null; S.vb = null; S.printSel = null; S.printCfg = null; S.unit = Store.settings().unit;
  }
};

/* ---------------- Visor interactivo (zoom / mover / seleccionar) ---------------- */
const Viewer = {
  data: null,
  init(){
    const svg = $('#board'); if (!svg) return;
    this.draw(true);
    const el = $('#viewer'); const ptrs = new Map(); let start = null, moved = false, pinch = null;
    const toSvg = (cx, cy) => { const r = svg.getBoundingClientRect(); return {x:S.vb.x + (cx - r.left) / r.width * S.vb.w, y:S.vb.y + (cy - r.top) / r.height * S.vb.h}; };
    el.onwheel = e => { e.preventDefault(); const p = toSvg(e.clientX, e.clientY); this.zoom(e.deltaY > 0 ? 1.15 : 1 / 1.15, p); };
    el.onpointerdown = e => { el.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY}); moved = false; start = {x:e.clientX, y:e.clientY, vb:Object.assign({}, S.vb)}; if (ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinch = {d:Math.hypot(a.x - b.x, a.y - b.y)}; } el.classList.add('drag'); };
    el.onpointermove = e => {
      if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if (ptrs.size === 2 && pinch){ const [a, b] = [...ptrs.values()]; const dd = Math.hypot(a.x - b.x, a.y - b.y); if (dd > 0){ this.zoom(pinch.d / dd, toSvg((a.x + b.x) / 2, (a.y + b.y) / 2)); pinch.d = dd; moved = true; } return; }
      const r = svg.getBoundingClientRect(); const dx = e.clientX - start.x, dy = e.clientY - start.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
      S.vb.x = start.vb.x - dx / r.width * start.vb.w; S.vb.y = start.vb.y - dy / r.height * start.vb.h; this.apply();
    };
    el.onpointerup = el.onpointercancel = e => {
      ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; el.classList.remove('drag');
      if (!moved && e.type === 'pointerup'){ const t = document.elementFromPoint(e.clientX, e.clientY); const g = t && t.closest && t.closest('[data-pc]'); S.sel = g ? g.getAttribute('data-pc') : null; this.draw(false); $('#infoPanel').innerHTML = UI.infoHTML(); }
      if (ptrs.size === 1){ const [p] = [...ptrs.values()]; start = {x:p.x, y:p.y, vb:Object.assign({}, S.vb)}; }
    };
    if (this._ro) this._ro.disconnect();
    if (window.ResizeObserver){ this._ro = new ResizeObserver(() => { if (S.vb) this.fitAspect(); }); this._ro.observe(el); }
  },
  draw(fit){
    const svg = $('#board'); if (!svg) return;
    const {L, body} = SVGR.board(S.res.pieces, S.design, Object.assign({}, S.layers, {sel:S.sel}));
    this.data = L;
    const grid = `<defs><pattern id="g10" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#dfe3dc" stroke-width="0.3"/></pattern><pattern id="g50" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#g10)"/><path d="M50 0H0V50" fill="none" stroke="#cdd3ca" stroke-width="0.6"/></pattern></defs><rect x="-3000" y="-3000" width="${fx(L.w + 6000)}" height="${fx(L.h + 6000)}" fill="url(#g50)"/>`;
    svg.innerHTML = grid + body;
    if (fit || !S.vb) this.fit(); else this.apply();
  },
  fit(code){
    let bx = -10, by = -10, bw = this.data.w + 20, bh = this.data.h + 20;
    if (code){ const it = this.data.items.find(i => i.pc.code === code); if (it){ bx = it.x - 10; by = it.y - 10; bw = it.bw + 20; bh = it.bh + 20; } }
    S.vb = {x:bx, y:by, w:bw, h:bh}; this.fitAspect();
  },
  fitAspect(){
    const el = $('#viewer'); if (!el) return; const ar = el.clientWidth / Math.max(1, el.clientHeight);
    const cx = S.vb.x + S.vb.w / 2, cy = S.vb.y + S.vb.h / 2;
    if (S.vb.w / S.vb.h > ar) S.vb.h = S.vb.w / ar; else S.vb.w = S.vb.h * ar;
    S.vb.x = cx - S.vb.w / 2; S.vb.y = cy - S.vb.h / 2; this.apply();
  },
  zoom(f, p){
    const el = $('#viewer'); if (!el) return;
    const nw = Math.min(20000, Math.max(20, S.vb.w * f)), k = nw / S.vb.w;
    p = p || {x:S.vb.x + S.vb.w / 2, y:S.vb.y + S.vb.h / 2};
    S.vb = {x:p.x - (p.x - S.vb.x) * k, y:p.y - (p.y - S.vb.y) * k, w:S.vb.w * k, h:S.vb.h * k}; this.apply();
  },
  apply(){
    const svg = $('#board'); if (!svg || !S.vb) return;
    svg.setAttribute('viewBox', `${fx(S.vb.x)} ${fx(S.vb.y)} ${fx(S.vb.w)} ${fx(S.vb.h)}`);
    const el = $('#viewer'), z = $('#zoomLvl'); if (el && z){ const pxPerMm = el.clientWidth / S.vb.w; z.textContent = `${(pxPerMm / 3.78 * 100).toFixed(0)} % aprox. en pantalla`; }
  }
};

/* ---------------- Eventos ---------------- */
function readImportFile(file){
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const data = JSON.parse(fr.result); const arr = Array.isArray(data) ? data : [data]; let n = 0;
      const ids = new Set(Store.designs().map(d => d.id));
      for (const d of arr){
        if (!d || !PRODUCTS[d.categoria] || typeof d.parametros !== 'object') continue;
        const x = Object.assign(newDesign(d.categoria), d, {parametros:Object.assign(defaultsOf(d.categoria), d.parametros)});
        if (ids.has(x.id)) { x.id = Util.uid(); x.nombre += ' (importado)'; x.codigo = nextCode(x.categoria); }
        x.fechaActualizacion = Util.now(); x.piezas = Engine.run(x).pieces; Store.saveDesign(x); ids.add(x.id); n++;
      }
      UI.toast(n ? `${n} diseño(s) importado(s) ✔` : 'El archivo no contiene diseños válidos de MOLDERA 360.', n ? 'ok' : 'err'); UI.render();
    } catch(e){ UI.toast('Archivo JSON no válido.', 'err'); }
  };
  fr.readAsText(file);
}
function exportDesign(d){ const res = Engine.run(d); const x = Object.assign({}, d, {piezas:res.pieces, app:'MOLDERA 360', unidades:'mm'}); Util.download(`${d.codigo}-${(d.nombre || 'diseno').replace(/[^\w\-]+/g, '_')}.json`, JSON.stringify(x, null, 2), 'application/json'); }
function confirmLeave(){ return !S.dirty || confirm('Hay cambios sin guardar. ¿Salir sin guardar?'); }

function bindEvents(){
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    const act = a.dataset.act;
    if (a.tagName === 'A') e.preventDefault();
    switch (act){
      case 'nav': if (S.view === 'editor' && a.dataset.view !== 'editor' && S.dirty && !confirm('Hay cambios sin guardar. ¿Salir del editor? (el diseño seguirá abierto)')) return; UI.go(a.dataset.view); break;
      case 'new': { if (S.view === 'editor' && !confirmLeave()) return; const d = newDesign(a.dataset.cat); d.codigo = nextCode(a.dataset.cat); d.nombre = `${PRODUCTS[a.dataset.cat].label} ${d.codigo.slice(-3)}`; UI.open(d); S.dirty = true; UI.refreshLive(); break; }
      case 'open': if (S.design) UI.go('editor'); break;
      case 'openId': { const d = Store.designs().find(x => x.id === a.dataset.id); if (d){ if (S.view === 'editor' && !confirmLeave()) return; UI.open(d); } break; }
      case 'dup': { const d = Store.designs().find(x => x.id === a.dataset.id); if (!d) break; const c = Util.clone(d); c.id = Util.uid(); c.codigo = nextCode(c.categoria); c.nombre = d.nombre + ' (copia)'; c.fechaCreacion = c.fechaActualizacion = Util.now(); Store.saveDesign(c); UI.toast('Diseño duplicado'); UI.render(); break; }
      case 'ren': { const d = Store.designs().find(x => x.id === a.dataset.id); if (!d) break; const n = prompt('Nuevo nombre:', d.nombre); if (n && n.trim()){ d.nombre = n.trim(); d.fechaActualizacion = Util.now(); Store.saveDesign(d); if (S.design && S.design.id === d.id) S.design.nombre = d.nombre; UI.render(); } break; }
      case 'del': { const d = Store.designs().find(x => x.id === a.dataset.id); if (d && confirm(`¿Eliminar «${d.nombre}»? Esta acción no se puede deshacer.`)){ Store.deleteDesign(d.id); if (S.design && S.design.id === d.id){ S.design = null; } UI.toast('Diseño eliminado'); UI.render(); } break; }
      case 'expId': { const d = Store.designs().find(x => x.id === a.dataset.id); if (d) exportDesign(d); break; }
      case 'expAll': Util.download('moldera360-biblioteca.json', JSON.stringify(Store.designs(), null, 2), 'application/json'); break;
      case 'import': $('#fileImport').click(); break;
      case 'resetDemos': if (confirm('¿Volver a crear los diseños de demostración?')){ Store.set(Store.K.seeded, false); Store.set(Store.K.designs, Store.designs().filter(d => !['BOL-001', 'BIL-001', 'MOR-001'].includes(d.codigo))); seedDemos(); UI.render(); } break;
      case 'back': UI.go('home'); break;
      case 'tab': S.tab = a.dataset.tab; document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === S.tab)); UI.renderTab(); $('#main').scrollTop = 0; break;
      case 'save': UI.save(); break;
      case 'regen': UI.regen(); UI.renderTab(); UI.refreshLive(); UI.toast(S.res.status === 'ERROR' ? 'Hay errores: revisa los parámetros.' : `Moldería regenerada · ${S.res.pieces.length} piezas`, S.res.status === 'ERROR' ? 'err' : ''); break;
      case 'setp': S.design.parametros[a.dataset.k] = a.dataset.v; UI.changed(true); break;
      case 'unit': S.unit = a.dataset.u; $('#paramForm').innerHTML = UI.form(); break;
      case 'margin': S.design.parametros.margen = +a.dataset.v; UI.changed(true); break;
      case 'marginCustom': S.design.parametros.margen = 6; UI.changed(true); break;
      case 'aiCmd': {
        const inp = $('#aiCmd'); const txt = inp.value.trim(); if (!txt) break;
        const r = AI.parse(txt, S.design);
        if (r.categoria && r.categoria !== S.design.categoria){ UI.toast(`Ese texto describe un ${PRODUCTS[r.categoria].label.toLowerCase()}. Usa «Diseñar con IA» para crearlo.`, 'err'); break; }
        const list = AI.describe(r, Object.assign(defaultsOf(S.design.categoria), S.design.parametros));
        if (!list.length){ UI.toast('No entendí el cambio. Ej.: «Hazlo 5 cm más alto», «Agrega un bolsillo frontal».', 'err'); break; }
        UI.applyAI(r, true); $('#paramForm').innerHTML = UI.form(); UI.refreshLive(); inp.value = ''; UI.toast('✦ ' + list.join(' · '), 'ok'); break;
      }
      case 'viewPiece': S.sel = a.dataset.code; S.tab = 'molderia'; S.vb = null; document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === S.tab)); UI.renderTab(); Viewer.fit(S.sel); break;
      case 'focusPiece': Viewer.fit(a.dataset.code); break;
      case 'zoomIn': Viewer.zoom(1 / 1.3); break;
      case 'zoomOut': Viewer.zoom(1.3); break;
      case 'fit': Viewer.fit(); break;
      case 'expSVG': if (!S.res.pieces.length) break; Util.download(`${S.design.codigo}-molderia-1a1.svg`, SVGR.exportSVG(S.res.pieces, S.design), 'image/svg+xml'); UI.toast('SVG descargado (escala 1:1, mm)'); break;
      case 'expJSON': exportDesign(Object.assign({}, S.design, {fechaActualizacion:Util.now()})); break;
      case 'printFicha': UI.printHTML('ficha', Ficha.html(S.design, S.res, Store.settings()), '@page{size:A4;margin:12mm}'); break;
      case 'printPiece': S.printSel = new Set([a.dataset.code]); S.tab = 'imprimir'; document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === S.tab)); UI.renderTab(); break;
      case 'pcfg': { const k = a.dataset.k; let v = a.dataset.v; if (k === 'scale') v = v === 'custom' ? 75 : +v; S.printCfg[k] = v; UI.renderTab(); break; }
      case 'selAll': S.printSel = new Set(S.res.pieces.map(p => p.code)); UI.renderTab(); break;
      case 'selNone': S.printSel = new Set(); UI.renderTab(); break;
      case 'doPrint': UI.doPrint(); break;
      case 'aiEx': S.aiText = a.dataset.t; $('#aiText').value = S.aiText; break;
      case 'aiRun': { S.aiText = $('#aiText').value; if (!S.aiText.trim()) { UI.toast('Escribe una descripción.', 'err'); break; } S.ai = AI.parse(S.aiText, S.design); UI.render(); break; }
      case 'aiNew': if (S.design && S.dirty && !confirm('El diseño abierto tiene cambios sin guardar. ¿Continuar?')) break; UI.applyAI(S.ai, false); S.ai = null; UI.go('editor'); break;
      case 'aiApply': UI.applyAI(S.ai, true); S.ai = null; S.tab = 'diseno'; UI.go('editor'); UI.toast('Parámetros aplicados y moldería regenerada', 'ok'); break;
      case 'logo': $('#fileLogo').click(); break;
      case 'logoDel': { const s = Store.settings(); s.logo = ''; Store.saveSettings(s); UI.render(); break; }
      case 'saveSettings': {
        const s = Store.settings();
        document.querySelectorAll('[data-set]').forEach(el => { const k = el.dataset.set; let v = el.value; if (['margin', 'printMargin', 'overlap', 'customW', 'customH'].includes(k)) v = +v; s[k] = v; });
        Store.saveSettings(s); S.printCfg = null; UI.toast('Configuración guardada ✔', 'ok'); break;
      }
    }
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.matches('[data-param]')){
      const k = t.dataset.param, ty = t.dataset.type;
      if (ty === 'bool') return;
      const raw = t.value.trim(), v = parseFloat(raw);
      S.design.parametros[k] = raw === '' || isNaN(v) ? null : (ty === 'len' ? fx(Units.toMM(v, S.unit)) : v);
      liveUpdate();
    } else if (t.matches('[data-meta]')){
      S.design[t.dataset.meta] = t.value; S.dirty = true; if (t.dataset.meta !== 'observaciones'){ UI.regen(); UI.refreshLive(); } else { const dm = $('#dirtyMark'); if (dm) dm.textContent = '● sin guardar'; }
    } else if (t.id === 'dName'){ S.design.nombre = t.value; S.dirty = true; const dm = $('#dirtyMark'); if (dm) dm.textContent = '● sin guardar'; UI.regen(); }
    else if (t.matches('[data-pcfg]') && t.type !== 'checkbox'){ S.printCfg[t.dataset.pcfg] = parseFloat(t.value); printUpdate(); }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.matches('[data-param][data-type="bool"]')){ S.design.parametros[t.dataset.param] = t.checked; UI.changed(true); }
    else if (t.matches('[data-layer]')){ S.layers[t.dataset.layer] = t.checked; Viewer.draw(false); }
    else if (t.matches('[data-pcfg]') && t.type === 'checkbox'){ S.printCfg[t.dataset.pcfg] = t.checked; UI.refreshPrintPreview(); }
    else if (t.matches('[data-psel]')){ if (t.checked) S.printSel.add(t.dataset.psel); else S.printSel.delete(t.dataset.psel); UI.refreshPrintPreview(); }
    else if (t.id === 'fileImport'){ if (t.files[0]) readImportFile(t.files[0]); t.value = ''; }
    else if (t.id === 'fileLogo' && t.files[0]){
      const fr = new FileReader(); fr.onload = () => { const img = new Image(); img.onload = () => { const k = Math.min(1, 320 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = R(img.width * k); c.height = R(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); const s = Store.settings(); s.logo = c.toDataURL('image/png'); Store.saveSettings(s); UI.render(); }; img.src = fr.result; }; fr.readAsDataURL(t.files[0]); t.value = '';
    }
  });
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && S.view === 'editor'){ e.preventDefault(); UI.save(); }
    if (e.key === 'Enter' && e.target.id === 'aiCmd'){ e.preventDefault(); document.querySelector('[data-act="aiCmd"]').click(); }
  });
  window.addEventListener('afterprint', () => { document.body.classList.remove('printing-pat', 'printing-ficha'); $('#printRoot').innerHTML = ''; });
  window.addEventListener('beforeunload', e => { if (S.dirty){ e.preventDefault(); e.returnValue = ''; } });
}
const liveUpdate = Util.debounce(() => { S.dirty = true; UI.regen(); UI.refreshLive(); }, 140);
const printUpdate = Util.debounce(() => UI.refreshPrintPreview(), 200);

if (typeof document !== 'undefined' && document.getElementById('app')){
  seedDemos(); bindEvents(); S.unit = Store.settings().unit; UI.render();
}
</script>
</body>
