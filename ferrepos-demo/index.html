   ===================================================================== */
const r2 = (n) => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
const r3 = (n) => Math.round((Number(n) + Number.EPSILON) * 1000) / 1000;

function calcularTotales(lineas, descuentoUsd) {
  const conSub = lineas.map((l) => ({ ...l, subtotal_usd: r2(l.cantidad * l.precio_usd) }));
  const subtotal = r2(conSub.reduce((a, l) => a + l.subtotal_usd, 0));
  const descuento = r2(Math.min(Math.max(0, Number(descuentoUsd) || 0), subtotal));
  const factor = subtotal > 0 ? descuento / subtotal : 0;
  let asignado = 0, impuesto = 0;
  conSub.forEach((l, i) => {
    const d = i === conSub.length - 1 ? r2(descuento - asignado) : r2(l.subtotal_usd * factor);
    asignado += d;
    impuesto += r2(r2(l.subtotal_usd - d) * (l.iva_pct / 100));
  });
  impuesto = r2(impuesto);
  return { subtotal_usd: subtotal, descuento_usd: descuento, impuesto_usd: impuesto, total_usd: r2(subtotal - descuento + impuesto), lineas: conSub };
}

function calcularCobro(totalUsd, pagos, tasa, igtfPct) {
  let pagado = 0, divisas = 0;
  for (const p of pagos) {
    const eq = p.moneda === 'USD' ? r2(p.monto) : r2(p.monto / tasa);
    pagado += eq;
    if (p.igtf) divisas += eq;
  }
  pagado = r2(pagado); divisas = r2(divisas);
  const base = igtfPct > 0 ? r2(Math.min(divisas, totalUsd)) : 0;
  const igtf = r2(base * igtfPct / 100);
  const cobrar = r2(totalUsd + igtf);
  const diff = r2(cobrar - pagado);
  return { pagado, base_igtf: base, igtf, cobrar, faltante: diff > 0.009 ? diff : 0, excedente: diff < -0.009 ? r2(-diff) : 0 };
}

function montoSugerido(totalUsd, pagos, metodo, tasa, igtfPct) {
  const actual = calcularCobro(totalUsd, pagos, tasa, igtfPct);
  if (actual.faltante <= 0) return 0;
  let usd = actual.faltante;
  const p = igtfPct / 100;
  if (p > 0 && metodo.igtf) {
    const pagadoDiv = pagos.filter((x) => x.igtf).reduce((a, x) => a + (x.moneda === 'USD' ? r2(x.monto) : r2(x.monto / tasa)), 0);
    const base = Math.max(0, totalUsd - pagadoDiv);
    const x = actual.faltante / (1 - p);
    usd = x <= base ? x : actual.faltante + p * base;
  }
  let monto = metodo.moneda === 'USD' ? r2(usd) : r2(usd * tasa);
  const paso = metodo.moneda === 'USD' ? 0.01 : Math.max(0.01, r2(tasa / 100));
  for (let i = 0; i < 5; i++) {
    const t = calcularCobro(totalUsd, [...pagos, { moneda: metodo.moneda, monto, igtf: metodo.igtf }], tasa, igtfPct);
    if (t.faltante <= 0) break;
    monto = r2(monto + paso);
  }
  return monto;
}

   Reglas de negocio (equivalentes a VentaService / CajaService / CxcService)
   ===================================================================== */
class ErrorNegocio extends Error {}

function deudaCliente(st, clienteId) {
  return r2(st.ventas.filter((v) => v.clienteId === clienteId && v.estado === 'COMPLETADA').reduce((a, v) => a + v.saldo, 0));
}

function registrarVentaInterna(st, o) {
  const cfg = st.config;
  const tasa = st.tasa;
  if (!o.items.length) throw new ErrorNegocio('El carrito está vacío.');
  const doc = String(o.doc || '').trim().toUpperCase();
  if (!doc) throw new ErrorNegocio('La cédula o RIF del cliente es obligatoria.');

  // Agrupa cantidades y valida stock
  const cant = {};
  o.items.forEach((i) => { cant[i.id] = r3((cant[i.id] || 0) + Number(i.cant)); });
  const lineas = Object.entries(cant).map(([id, c]) => {
    const p = st.productos.find((x) => x.id === Number(id));
    if (!p) throw new ErrorNegocio('Producto no encontrado.');
    if (!UNIDADES[p.um] && c % 1 !== 0) throw new ErrorNegocio(`"${p.nombre}" se vende por ${p.um} y no admite decimales.`);
    if (!o.sinStock && c > p.stock + 0.0005) throw new ErrorNegocio(`Stock insuficiente para "${p.nombre}". Disponible: ${fmtCant(p.stock)} ${p.um}.`);
    return { p, cantidad: c, precio_usd: p.precio, iva_pct: p.iva };
  });

  const t = calcularTotales(lineas, o.descuento);
  if (o.rol === 'CAJERO' && t.descuento_usd > r2(t.subtotal_usd * cfg.descMaxCajero / 100) + 0.001) {
    throw new ErrorNegocio(`El descuento máximo para cajeros es ${cfg.descMaxCajero}% (${usd(r2(t.subtotal_usd * cfg.descMaxCajero / 100))}).`);
  }
  const igtfPct = cfg.igtf ? cfg.igtfPct : 0;
  let pagos = (o.pagos || []).map((p) => { const m = metodo(p.metodo_id); return { metodo_id: m.id, moneda: m.moneda, monto: r2(p.monto), igtf: m.igtf, ref: p.ref || null }; });
  if (o.pagos === null && o.metodoAuto) {
    const m = o.metodoAuto;
    pagos = [{ metodo_id: m.id, moneda: m.moneda, monto: montoSugerido(t.total_usd, [], m, tasa, igtfPct), igtf: m.igtf, ref: m.ref ? String(100000 + st.correlativo * 37).slice(-6) : null }];
  }
  const c = calcularCobro(t.total_usd, pagos, tasa, igtfPct);
  let condicion = o.condicion;
  let saldo = 0;
  if (condicion === 'CONTADO' && c.faltante > 0.02) throw new ErrorNegocio(`Falta cobrar ${usd(c.faltante)} (${ves(r2(c.faltante * tasa))}).`);
  if (condicion === 'CREDITO') {
    saldo = c.faltante;
    if (saldo <= 0.02) { condicion = 'CONTADO'; saldo = 0; }
  }

  let cliente = st.clientes.find((x) => x.doc === doc);
  if (!cliente) {
    cliente = { id: Math.max(0, ...st.clientes.map((x) => x.id)) + 1, doc, nombre: o.nombre || '', tel: '', limite: 0 };
    st.clientes.push(cliente);
  } else if (o.nombre && !cliente.nombre) cliente.nombre = o.nombre;

  if (condicion === 'CREDITO') {
    if (cliente.limite <= 0) throw new ErrorNegocio(`${cliente.doc} no tiene crédito aprobado.`);
    const deuda = deudaCliente(st, cliente.id);
    if (deuda + saldo > cliente.limite + 0.009) throw new ErrorNegocio(`Límite de crédito excedido. Disponible: ${usd(Math.max(0, cliente.limite - deuda))}.`);
  }

  const f = o.fechaObj || new Date();
  st.correlativo += 1;
  const venta = {
    id: st.correlativo,
    numero: 'FAC-' + String(st.correlativo).padStart(6, '0'),
    fecha: fechaHora(f), dia: fecha(f),
    clienteId: cliente.id, doc: cliente.doc, cliente: cliente.nombre,
    usuario: o.usuario, tasa, condicion,
    subtotal: t.subtotal_usd, descuento: t.descuento_usd, impuesto: t.impuesto_usd, total: t.total_usd,
    baseIgtf: c.base_igtf, igtf: c.igtf, cobrar: c.cobrar, saldo: r2(saldo),
    vencimiento: condicion === 'CREDITO' ? fecha(sumarDias(f, o.diasCredito || cfg.diasCredito)) : null,
    vueltoUsd: c.excedente, vueltoVes: 0,
    estado: 'COMPLETADA', caja: o.caja ?? null,
    detalles: t.lineas.map((l) => ({ id: l.p.id, nombre: l.p.nombre, um: l.p.um, cant: l.cantidad, precio: l.precio_usd, sub: l.subtotal_usd, costo: l.p.costo })),
    pagos: pagos.map((p) => ({ ...p, eq: p.moneda === 'USD' ? p.monto : r2(p.monto / tasa) }))
  };
  if (!o.sinStock) t.lineas.forEach((l) => { l.p.stock = r3(l.p.stock - l.cantidad); });
  st.ventas.push(venta);
  return venta;
}

function cajaAbierta(st) { return st.cajas.find((c) => c.estado === 'ABIERTA') || null; }

function resumenCaja(st, caja) {
  const filas = METODOS.map((m) => ({ m, fondo: 0, ventas: 0, abonos: 0, vueltos: 0, n: 0 }));
  const ventas = st.ventas.filter((v) => v.caja === caja.id);
  ventas.filter((v) => v.estado === 'COMPLETADA').forEach((v) => {
    v.pagos.forEach((p) => { const f = filas[p.metodo_id - 1]; f.ventas = r2(f.ventas + p.monto); f.n++; });
    filas[1].vueltos = r2(filas[1].vueltos + v.vueltoUsd);
    filas[0].vueltos = r2(filas[0].vueltos + v.vueltoVes);
  });
  st.abonos.filter((a) => a.caja === caja.id).forEach((a) => { const f = filas[a.metodo_id - 1]; f.abonos = r2(f.abonos + a.monto); f.n++; });
  filas[1].fondo = caja.fondoUsd; filas[0].fondo = caja.fondoVes;
  filas.forEach((f) => { f.esperado = r2(f.fondo + f.ventas + f.abonos - f.vueltos); });
  const ok = ventas.filter((v) => v.estado === 'COMPLETADA');
  return {
    filas: filas.filter((f) => f.n > 0 || f.fondo > 0),
    facturas: ok.length,
    anuladas: ventas.length - ok.length,
    vendido: r2(ok.reduce((a, v) => a + v.total, 0)),
    igtf: r2(ok.reduce((a, v) => a + v.igtf, 0)),
    credito: r2(ok.filter((v) => v.condicion === 'CREDITO').reduce((a, v) => a + v.saldo, 0))
  };
}

const carrito = () => S.carrito;
function totalesCarrito() {
  const lineas = carrito().items.map((i) => { const p = S.productos.find((x) => x.id === i.id); return { precio_usd: p.precio, cantidad: i.cant, iva_pct: p.iva }; });
  return calcularTotales(lineas, carrito().descuento);
}
function clienteCarrito() { const d = carrito().doc.trim().toUpperCase(); return d ? S.clientes.find((c) => c.doc === d || c.doc.replace(/\D/g, '') === d.replace(/\D/g, '') && d.replace(/\D/g, '').length >= 5) : null; }
function descMax() { const t = totalesCarrito(); return esAdmin() ? t.subtotal_usd : r2(t.subtotal_usd * S.config.descMaxCajero / 100); }

function agregar(id, cant) {
  const p = S.productos.find((x) => x.id === id);
  const dec = UNIDADES[p.um];
  const c = dec ? r3(cant) : Math.max(1, Math.round(cant));
  const it = carrito().items.find((i) => i.id === id);
  const nueva = dec ? r3((it?.cant || 0) + c) : Math.round((it?.cant || 0) + c);
  if (nueva > p.stock) { UI.alerta = { tipo: 'bad', msg: `Stock insuficiente para "${p.nombre}". Disponible: ${fmtCant(p.stock)} ${p.um}.` }; return false; }
  if (it) it.cant = nueva; else carrito().items.push({ id, cant: nueva });
  UI.alerta = null;
  guardar();
  return true;
}

function escanear() {
  let q = UI.q.trim();
  if (!q) return;
  let cant = 1;
  const m = q.match(/^(\d+(?:[.,]\d+)?)\s*[*xX]\s*(.+)$/);
  if (m) { cant = Number(m[1].replace(',', '.')); q = m[2].trim(); }
  const ql = q.toLowerCase();
  const exacto = S.productos.find((p) => p.barra === q || p.sku.toLowerCase() === ql);
  const lista = productosFiltrados();
  const p = exacto || (lista.length === 1 ? lista[0] : null);
  if (!p) {
    UI.alerta = { tipo: 'bad', msg: lista.length ? `Hay ${lista.length} coincidencias para "${q}". Elija el producto.` : `No hay ningún producto con el código "${q}".` };
    $('#pos-alerta').innerHTML = alertaHtml();
    return;
  }
  if (agregar(p.id, cant)) { UI.q = ''; $('#buscar').value = ''; renderGrid(); }
  $('#pos-alerta').innerHTML = alertaHtml();
  renderCart();
}

function aparcar() {
  const c = carrito();

  const cli = clienteCarrito();
  S.espera.push({ etiqueta: cli?.nombre || c.doc || `Venta ${S.espera.length + 1}`, total: totalesCarrito().total_usd, carrito: JSON.parse(JSON.stringify(c)) });
  S.carrito = { items: [], doc: '', descuento: 0 };

  vistaPos();
}

/* ---------- Cobro ---------- */
function abrirCobro() {
  const c = carrito();
  if (!c.items.length) return;
  if (!c.doc.trim()) { UI.alerta = { tipo: 'bad', msg: 'Ingrese la cédula o RIF del cliente (único dato obligatorio).' }; $('#pos-alerta').innerHTML = alertaHtml(); $('#doc').focus(); return; }
  if (S.config.cajaObligatoria && !cajaAbierta(S)) return;
  UI.cobro = { condicion: 'CONTADO', pagos: [], metodoId: 2, monto: '', ref: '', error: '' };
  sugerir();
  renderModal();
}
/** Pagos del cobro con moneda e IGTF de su método (lo que espera el motor de cálculo). */
function pagosCobro() {
  return UI.cobro.pagos.map((p) => { const m = metodo(p.metodo_id); return { ...p, moneda: m.moneda, igtf: m.igtf }; });
}
function cobroCalc() {
  const t = totalesCarrito();
  return { t, c: calcularCobro(t.total_usd, pagosCobro(), S.tasa, S.config.igtf ? S.config.igtfPct : 0) };
}
function sugerir() {
  const { t } = cobroCalc();
  const m = metodo(UI.cobro.metodoId);
  const s = montoSugerido(t.total_usd, pagosCobro(), m, S.tasa, S.config.igtf ? S.config.igtfPct : 0);
  UI.cobro.monto = s > 0 ? s.toFixed(2) : '';
}
function emitir() {
  const cb = UI.cobro;
  const { c } = cobroCalc();
  const cli = clienteCarrito();
  if (cb.condicion === 'CONTADO' && !cb.pagos.length) { cb.error = 'Agregue al menos un pago.'; return renderModal(); }
  if (cb.condicion === 'CONTADO' && c.faltante > 0.02) { cb.error = `Falta cobrar ${usd(c.faltante)} (${bs(c.faltante)}).`; return renderModal(); }
  if (cb.condicion === 'CREDITO' && c.faltante > Math.max(0, (cli?.limite || 0) - deudaCliente(S, cli?.id)) + 0.009) { cb.error = 'El saldo supera el crédito disponible del cliente.'; return renderModal(); }
  try {
    const caja = cajaAbierta(S);
    const v = registrarVentaInterna(S, {
      items: carrito().items, doc: carrito().doc, descuento: carrito().descuento, condicion: cb.condicion,
      pagos: cb.pagos.map((p) => ({ metodo_id: p.metodo_id, monto: p.monto, ref: p.ref })), rol: S.rol, usuario: usuarioActual(), caja: caja ? caja.id : null
    });
    S.carrito = { items: [], doc: '', descuento: 0 };
    UI.cobro = null;
    UI.ticket = v.id;
    UI.alerta = { tipo: 'ok', msg: `Factura ${v.numero} emitida.` };
    guardar();
    render();
  } catch (e) {
    if (!(e instanceof ErrorNegocio)) throw e;
    cb.error = e.message;
    renderModal();
  }
}

function abonar() {
  const x = UI.cxc;
  const v = S.ventas.find((y) => y.id === x.venta);
  const m = metodo(x.metodo);
  const monto = r2(Number(x.monto));
  x.error = '';
  if (!v || !(monto > 0)) { x.error = 'Elija una factura e indique un monto mayor a cero.'; return; }
  if (m.ref && !String(x.ref).trim()) { x.error = `${m.nombre} requiere número de referencia.`; return; }
  const caja = cajaAbierta(S);
  if (S.config.cajaObligatoria && !caja) { x.error = 'Abra la caja antes de registrar cobros.'; return; }
  const eq = m.moneda === 'USD' ? monto : r2(monto / S.tasa);
  if (eq > v.saldo + 0.02) { x.error = `El abono (${usd(eq)}) supera el saldo (${usd(v.saldo)}).`; return; }
  v.saldo = r2(Math.max(0, v.saldo - Math.min(eq, v.saldo)));
  S.abonos.push({ venta: v.id, cliente: v.clienteId, metodo_id: m.id, moneda: m.moneda, monto, eq, saldoDespues: v.saldo, caja: caja ? caja.id : null, fecha: fechaHora(new Date()) });
  x.monto = ''; x.ref = '';
  guardar();
  toast(`Abono registrado · saldo ${usd(v.saldo)}`);
}

/* =====================================================================
   Reportes
   ===================================================================== */
function vistaReportes() {
  const hasta = UI.hasta || hoyStr();
  const desde = UI.desde || fecha(sumarDias(new Date(), -13));
  const ventas = S.ventas.filter((v) => v.dia >= desde && v.dia <= hasta);
  const ok = ventas.filter((v) => v.estado === 'COMPLETADA');
  const sum = (arr, f) => r2(arr.reduce((a, x) => a + f(x), 0));
  const total = sum(ok, (v) => v.total);
  const neta = sum(ok, (v) => v.subtotal - v.descuento);
  const costo = sum(ok, (v) => v.detalles.reduce((a, d) => a + d.cant * d.costo, 0));
  const util = r2(neta - costo);
  const dias = [];
  for (let d = new Date(desde + 'T12:00'); fecha(d) <= hasta; d = sumarDias(d, 1)) {
    const f = fecha(d); const dv = ok.filter((v) => v.dia === f);
    dias.push({ f, total: sum(dv, (v) => v.total), util: r2(sum(dv, (v) => v.subtotal - v.descuento) - sum(dv, (v) => v.detalles.reduce((a, x) => a + x.cant * x.costo, 0))), n: dv.length });
  }
  const max = Math.max(1, ...dias.map((d) => d.total));
  const prods = {};
  ok.forEach((v) => v.detalles.forEach((d) => { const p = (prods[d.id] ||= { nombre: d.nombre, um: d.um, cant: 0, venta: 0, util: 0 }); p.cant = r3(p.cant + d.cant); p.venta = r2(p.venta + d.sub); p.util = r2(p.util + d.sub - d.cant * d.costo); }));
  const top = Object.values(prods).sort((a, b) => b.venta - a.venta).slice(0, 8);
  const met = {};
  ok.forEach((v) => v.pagos.forEach((p) => { const x = (met[p.metodo_id] ||= { m: metodo(p.metodo_id), monto: 0, eq: 0, n: 0 }); x.monto = r2(x.monto + p.monto); x.eq = r2(x.eq + p.eq); x.n++; }));
  const mets = Object.values(met).sort((a, b) => b.eq - a.eq);
  const totMet = mets.reduce((a, x) => a + x.eq, 0) || 1;

  $('#page').innerHTML = `<div class="head"><div><h2>Reportes</h2><p>Utilidad bruta y margen calculados con el costo histórico de cada venta (costo promedio ponderado).</p></div>
      <div class="row"><input id="r-desde" class="inp" type="date" value="${desde}" aria-label="Desde" style="width:auto"><span class="muted">→</span><input id="r-hasta" class="inp" type="date" value="${hasta}" aria-label="Hasta" style="width:auto"></div></div>
    <div class="stack">
    <div class="grid g4">
      <div class="card"><div class="kpi-l">Ventas con IVA</div><div class="kpi-v usd">${usd(total)}</div><div class="num ves small">${ves(sum(ok, (v) => v.total * v.tasa))}</div></div>
      <div class="card"><div class="kpi-l">Utilidad bruta</div><div class="kpi-v ${util >= 0 ? 'usd' : 'bad'}">${usd(util)}</div><div class="muted small">Margen ${neta > 0 ? (util / neta * 100).toFixed(1) : '0.0'}% · costo ${usd(costo)}</div></div>
      <div class="card"><div class="kpi-l">Facturas</div><div class="kpi-v">${ok.length}</div><div class="muted small">Ticket promedio ${usd(ok.length ? total / ok.length : 0)} · ${ventas.length - ok.length} anuladas</div></div>
      <div class="card"><div class="kpi-l">Impuestos</div><div class="kpi-v">${usd(sum(ok, (v) => v.impuesto))}</div><div class="muted small">IGTF ${usd(sum(ok, (v) => v.igtf))} · descuentos ${usd(sum(ok, (v) => v.descuento))}</div></div>
    </div>
    <div class="card"><div class="row" style="justify-content:space-between"><h3>Ventas por día</h3><span class="muted small"><span style="display:inline-block;width:10px;height:10px;background:var(--amber);border-radius:2px"></span> venta total · <span style="display:inline-block;width:10px;height:10px;background:var(--usd);border-radius:2px"></span> utilidad</span></div>
      <div class="bars">${dias.map((d) => `<div class="bar-c" title="${d.f}: ${usd(d.total)} · ${d.n} facturas · utilidad ${usd(d.util)}"><span class="bar-v">${d.total ? Math.round(d.total) : ''}</span>
        <div class="bar" style="height:${Math.max(2, d.total / max * 150)}px"><i style="height:${d.total ? Math.max(0, Math.min(100, d.util / d.total * 100)) : 0}%"></i></div><span class="bar-d">${d.f.slice(8)}/${d.f.slice(5, 7)}</span></div>`).join('')}</div></div>
    <div class="grid g2" style="align-items:start">
      <div class="card stack"><h3>Productos más vendidos</h3><div class="tw"><table><thead><tr><th>Producto</th><th class="r">Cant.</th><th class="r">Venta</th><th class="r">Utilidad</th></tr></thead><tbody>
        ${top.map((p) => `<tr><td>${esc(p.nombre)}</td><td class="r num">${fmtCant(p.cant)} ${p.um}</td><td class="r num">${usd(p.venta)}</td><td class="r num">${usd(p.util)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Sin ventas.</td></tr>'}</tbody></table></div></div>
      <div class="card stack"><h3>Por método de pago</h3>
        ${mets.map((x) => `<div><div class="row" style="justify-content:space-between;font-size:.84rem"><span>${x.m.nombre} <span class="muted">(${x.n})</span></span><span class="num">${x.m.moneda === 'USD' ? usd(x.monto) : ves(x.monto)} <span class="muted">· ${(x.eq / totMet * 100).toFixed(1)}%</span></span></div><div class="meter"><i style="width:${x.eq / totMet * 100}%"></i></div></div>`).join('') || '<div class="empty">Sin ventas.</div>'}
        <div class="muted small">La exportación a Excel (CSV) está disponible en la versión instalada.</div></div>
    </div></div>`;
}

/* =====================================================================
   Configuración
   ===================================================================== */
function vistaConfig() {
  const c = S.config;
  const demo = S.ventas.filter((v) => v.estado === 'COMPLETADA').slice(-1)[0];
  $('#page').innerHTML = `<div class="head"><div><h2>Configuración</h2><p>Los cambios se aplican al instante en el POS, el ticket y las reglas de caja y crédito.</p></div></div>
    <div class="grid g2" style="align-items:start">
      <div class="stack">
        <div class="card stack"><h3>Datos del negocio</h3>
          <div class="field"><label for="c-emp">Nombre o razón social</label><input id="c-emp" class="inp" data-in="cfg" data-v="empresa" value="${esc(c.empresa)}"></div>
          <div class="grid g2"><div class="field"><label for="c-rif">RIF</label><input id="c-rif" class="inp num" data-in="cfg" data-v="rif" value="${esc(c.rif)}"></div>
          <div class="field"><label for="c-tel">Teléfono</label><input id="c-tel" class="inp num" data-in="cfg" data-v="telefono" value="${esc(c.telefono)}"></div></div>
          <div class="field"><label for="c-dir">Dirección</label><input id="c-dir" class="inp" data-in="cfg" data-v="direccion" value="${esc(c.direccion)}"></div>
          <div class="field"><label for="c-pie">Mensaje al pie del ticket</label><input id="c-pie" class="inp" data-in="cfg" data-v="pie" value="${esc(c.pie)}"></div></div>
        <div class="card stack"><h3>IGTF</h3>
          <label class="row"><input id="c-igtf" type="checkbox" data-in="cfg-bool" data-v="igtf" ${c.igtf ? 'checked' : ''}> Cobrar IGTF sobre pagos en divisas (efectivo USD, Zelle, Binance)</label>
          <div class="field" style="max-width:180px"><label for="c-igtfp">Porcentaje</label><input id="c-igtfp" class="inp num" type="number" min="0" max="100" step="0.01" data-in="cfg-num" data-v="igtfPct" value="${c.igtfPct}"></div></div>
        <div class="card stack"><h3>Reglas de operación</h3>
          <label class="row"><input id="c-caja" type="checkbox" data-in="cfg-bool" data-v="cajaObligatoria" ${c.cajaObligatoria ? 'checked' : ''}> Exigir caja abierta para facturar y cobrar</label>
          <div class="grid g2"><div class="field"><label for="c-desc">Descuento máx. cajeros (%)</label><input id="c-desc" class="inp num" type="number" min="0" max="100" data-in="cfg-num" data-v="descMaxCajero" value="${c.descMaxCajero}"></div>
          <div class="field"><label for="c-dias">Días de crédito</label><input id="c-dias" class="inp num" type="number" min="1" max="365" data-in="cfg-num" data-v="diasCredito" value="${c.diasCredito}"></div></div></div>
      </div>
      <div class="card stack"><h3>Vista previa del ticket</h3><div class="muted small">Última factura emitida, tal como sale en la térmica de 80 mm.</div>
        <div id="cfg-ticket" style="background:var(--sunken);padding:14px 8px 20px;border-radius:8px">${demo ? ticketHtml(demo) : ''}</div></div>
    </div>`;
}

/* =====================================================================
   Eventos
   ===================================================================== */
const ACCIONES = {
  rol: (d) => { S.rol = d.v; guardar(); UI.alerta = null; render(); toast(d.v === 'ADMIN' ? 'Viendo como administrador' : 'Viendo como cajero: menú y descuentos limitados'); },
  reset: () => { UI.confirmar = { titulo: 'Reiniciar la demo', texto: 'Se borran las ventas, cajas y cambios que hizo y se vuelven a cargar los datos de ejemplo.', boton: 'Reiniciar', peligro: true, fn: () => { S = estadoInicial(); guardar(); UI.alerta = null; toast('Demo reiniciada'); } }; renderModal(); },
  cat: (d) => { UI.cat = d.v === '' ? null : Number(d.v); vistaPos(); },
  add: (d) => { agregar(Number(d.v), Number(d.c)); $('#pos-alerta').innerHTML = alertaHtml(); renderCart(); },
  quitar: (d) => { S.carrito.items = S.carrito.items.filter((i) => i.id !== Number(d.v)); guardar(); renderCart(); },
  vaciar: () => { S.carrito = { items: [], doc: '', descuento: 0 }; guardar(); renderCart(); },
  esperar: aparcar,
  recuperar: (d) => { const e = S.espera.splice(Number(d.v), 1)[0]; if (S.carrito.items.length) S.espera.push({ etiqueta: clienteCarrito()?.nombre || S.carrito.doc || 'Venta', total: totalesCarrito().total_usd, carrito: S.carrito }); S.carrito = e.carrito; guardar(); vistaPos(); },
  cobrar: abrirCobro,
  'ir-ticket': () => { $('#cart').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); },
  condicion: (d) => { UI.cobro.condicion = d.v; UI.cobro.error = ''; renderModal(); },
  'pago-add': () => {
    const cb = UI.cobro; const m = metodo(cb.metodoId); const monto = r2(Number(cb.monto));
    cb.error = '';
    if (!(monto > 0)) cb.error = 'El monto debe ser mayor a cero.';
    else if (m.ref && !cb.ref.trim()) cb.error = `${m.nombre} requiere número de referencia.`;
    else { cb.pagos.push({ metodo_id: m.id, monto, ref: cb.ref.trim() || null }); cb.ref = ''; cb.metodoId = 2; sugerir(); }
    renderModal(); document.getElementById('monto')?.focus();
  },
  'pago-del': (d) => { UI.cobro.pagos.splice(Number(d.v), 1); sugerir(); renderModal(); },
  emitir,
  'cerrar-modal': () => { const habiaTicket = UI.ticket; UI.cobro = null; UI.ticket = null; UI.confirmar = null; UI.cxc = null; render(); if (habiaTicket) $('#buscar')?.focus(); },
  'cerrar-modal-bg': (d, el, e) => { if (e.target === el) ACCIONES['cerrar-modal'](); },
  'confirmar-ok': () => { const fn = UI.confirmar.fn; UI.confirmar = null; fn(); render(); },
  'ver-ticket': (d) => { UI.ticket = Number(d.v); renderModal(); },
  anular: (d) => { const v = S.ventas.find((x) => x.id === Number(d.v)); UI.confirmar = { titulo: `Anular ${v.numero}`, texto: 'Los productos regresan al inventario y la factura queda marcada como anulada.', boton: 'Anular factura', peligro: true, fn: () => anular(v.id) }; renderModal(); },
  'abrir-caja': () => { S.cajas.push({ id: S.cajas.length + 1, usuario: 'Caja principal', estado: 'ABIERTA', fondoUsd: r2(Number($('#fusd').value) || 0), fondoVes: r2(Number($('#fves').value) || 0), abierta: fechaHora(new Date()), cerrada: null, esperado: null, contado: null, dif: null }); UI.conteos = {}; UI.alerta = { tipo: 'ok', msg: 'Caja abierta. Ya puede facturar.' }; guardar(); render(); },
  'cerrar-caja': () => {
    UI.confirmar = { titulo: 'Cerrar la caja', texto: 'Se registra el arqueo con los montos contados. Los métodos sin contar quedan en cero.', boton: 'Cerrar caja', peligro: true, fn: () => {
      const caja = cajaAbierta(S); const r = resumenCaja(S, caja);
      const aUsd = (n, m) => (m.moneda === 'USD' ? n : n / S.tasa);
      let esp = 0, cont = 0;
      r.filas.forEach((f) => { esp += aUsd(f.esperado, f.m); cont += aUsd(Number(UI.conteos[f.m.id] || 0), f.m); });
      Object.assign(caja, { estado: 'CERRADA', cerrada: fechaHora(new Date()), esperado: r2(esp), contado: r2(cont), dif: r2(cont - esp) });
      UI.alerta = { tipo: Math.abs(caja.dif) < 0.01 ? 'ok' : 'bad', msg: `Caja cerrada. Diferencia total: ${usd(caja.dif)}.` };
      UI.conteos = {}; guardar();
    } };
    renderModal();
  },
  'cxc-abrir': (d) => { UI.cxc = { cliente: Number(d.v), venta: null, metodo: 2, monto: '', ref: '', error: '' }; renderModal(); },
  'cxc-fact': (d) => { UI.cxc.venta = Number(d.v); renderModal(); },
  'cxc-saldar': (d, el, e) => { e.preventDefault(); const v = S.ventas.find((y) => y.id === UI.cxc.venta); const m = metodo(UI.cxc.metodo); if (v) UI.cxc.monto = (m.moneda === 'USD' ? v.saldo : r2(v.saldo * S.tasa)).toFixed(2); renderModal(); },
  'cxc-abonar': () => { abonar(); renderModal(); vistaCxc(); }
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const fn = ACCIONES[el.dataset.a];
  if (fn) fn(el.dataset, el, e);
});

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.id === 'buscar') { UI.q = el.value; renderGrid(); return; }
  if (el.id === 'doc') { S.carrito.doc = el.value.toUpperCase(); guardar(); const cli = clienteCarrito(); $('#cli-info').innerHTML = clienteInfo(cli, cli ? deudaCliente(S, cli.id) : 0); return; }
  if (el.id === 'desc') { S.carrito.descuento = Math.max(0, Number(el.value) || 0); guardar(); const t = totalesCarrito(); const keep = el.selectionStart; $('#sum').innerHTML = resumenHtml(t); const n = $('#desc'); n.focus(); try { n.setSelectionRange(keep, keep); } catch { /* number inputs */ } return; }
  const k = el.dataset.in;
  if (k === 'monto') UI.cobro.monto = el.value;
  if (k === 'ref') UI.cobro.ref = el.value;
  if (k === 'cxc-monto') UI.cxc.monto = el.value;
  if (k === 'cxc-ref') UI.cxc.ref = el.value;
  if (k === 'conteo') {
    UI.conteos[el.dataset.v] = el.value;
    const caja = cajaAbierta(S); const f = resumenCaja(S, caja).filas.find((x) => x.m.id === Number(el.dataset.v));
    const td = document.getElementById('dif-' + el.dataset.v);
    if (f && td) { const tmp = document.createElement('tbody'); tmp.innerHTML = filaArqueo(f); const nuevo = tmp.querySelector('#dif-' + el.dataset.v); td.className = nuevo.className; td.textContent = nuevo.textContent; }
  }
  if (k === 'cfg') { S.config[el.dataset.v] = el.value; guardar(); $('#empresa-top').textContent = S.config.empresa; const d = S.ventas.filter((v) => v.estado === 'COMPLETADA').slice(-1)[0]; if (d) $('#cfg-ticket').innerHTML = ticketHtml(d); }
  if (k === 'cfg-num') { const n = Number(el.value); if (el.value !== '' && n >= 0) { S.config[el.dataset.v] = n; guardar(); } }
});

document.addEventListener('change', (e) => {
  const el = e.target;
  const k = el.dataset.in;
  if (el.id === 'rate-input') { const n = r2(Number(el.value)); if (n > 0) { S.tasa = n; guardar(); toast(`Nueva tasa: Bs. ${n.toFixed(2)} por dólar`); } render(); return; }
  if (el.id === 'r-desde' || el.id === 'r-hasta') { UI.desde = $('#r-desde').value; UI.hasta = $('#r-hasta').value; if (UI.desde > UI.hasta) [UI.desde, UI.hasta] = [UI.hasta, UI.desde]; vistaReportes(); return; }
  if (k === 'qty') {
    const p = S.productos.find((x) => x.id === Number(el.dataset.v));
    const it = S.carrito.items.find((i) => i.id === p.id);
    let c = Number(el.value);
    if (!(c > 0)) S.carrito.items = S.carrito.items.filter((i) => i !== it);
    else { c = UNIDADES[p.um] ? r3(c) : Math.floor(c); it.cant = Math.min(c, p.stock); if (it.cant <= 0) S.carrito.items = S.carrito.items.filter((i) => i !== it); }
    guardar(); renderCart(); return;
  }
  if (k === 'metodo') { UI.cobro.metodoId = Number(el.value); UI.cobro.ref = ''; sugerir(); renderModal(); return; }
  if (k === 'cxc-metodo') { UI.cxc.metodo = Number(el.value); UI.cxc.monto = ''; renderModal(); return; }
  if (k === 'limite') { const c = S.clientes.find((x) => x.id === Number(el.dataset.v)); c.limite = Math.max(0, r2(Number(el.value) || 0)); guardar(); toast(`Límite de ${c.nombre || c.doc}: ${usd(c.limite)}`); return; }
  if (k === 'cfg-bool') { S.config[el.dataset.v] = el.checked; guardar(); renderNav(); toast('Configuración guardada'); }
  if (k === 'cfg-num') { const n = Number(el.value); if (n >= 0) { S.config[el.dataset.v] = n; guardar(); toast('Configuración guardada'); } }
});

document.addEventListener('keydown', (e) => {
  const enPos = vistaActual().id === 'pos';
  if (e.key === 'Enter' && e.target.id === 'buscar') { e.preventDefault(); escanear(); return; }
  if (e.key === 'Enter' && e.target.id === 'ref') { e.preventDefault(); ACCIONES['pago-add'](); return; }
  if (e.key === 'Enter' && e.target.id === 'monto') { e.preventDefault(); ACCIONES['pago-add'](); return; }
  if (e.key === 'Escape' && (UI.cobro || UI.ticket || UI.confirmar || UI.cxc)) { ACCIONES['cerrar-modal'](); return; }
  if (!enPos) return;
  if (e.key === 'F2') { e.preventDefault(); $('#buscar')?.focus(); }
  if (e.key === 'F4') { e.preventDefault(); $('#doc')?.focus(); }
  if (e.key === 'F8') { e.preventDefault(); if (!UI.cobro) aparcar(); }
  if (e.key === 'F9') { e.preventDefault(); if (UI.cobro) emitir(); else if (!UI.ticket) abrirCobro(); }
});

window.addEventListener('hashchange', () => { UI.alerta = null; render(); window.scrollTo(0, 0); });
render();
</script>

</body>
</html>
