<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora ONE MORE - Premium</title>
    <style>
        /* ===== RESET Y BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ===== CONTENEDOR PRINCIPAL ===== */
        .calculator {
            max-width: 900px;
            width: 100%;
            background: #111111;
            border-radius: 24px;
            padding: 40px;
            border: 1px solid #1a1a1a;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid #1a1a1a;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #d4a843, #b8922f);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: #0a0a0a;
        }

        .logo-text {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo-text span {
            color: #d4a843;
        }

        .badge {
            background: #1a1a1a;
            color: #d4a843;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid #2a2a2a;
        }

        /* ===== CONFIGURACIÓN ===== */
        .config-section {
            background: #0d0d0d;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 28px;
            border: 1px solid #1a1a1a;
        }

        .config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .config-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .config-item label {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .config-item select,
        .config-item input {
            background: #1a1a1a;
            color: #ffffff;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            transition: all 0.3s ease;
            width: 100%;
        }

        .config-item select:focus,
        .config-item input:focus {
            outline: none;
            border-color: #d4a843;
            box-shadow: 0 0 0 3px rgba(212, 168, 67, 0.1);
        }

        .config-item select option {
            background: #1a1a1a;
            color: #ffffff;
        }

        .tasa-display {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 10px 14px;
            border: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tasa-display .valor {
            color: #d4a843;
            font-weight: 700;
            font-size: 16px;
        }

        .tasa-display .info {
            color: #666;
            font-size: 11px;
        }

        .btn-tasa {
            background: #1a1a1a;
            color: #d4a843;
            border: 1px solid #2a2a2a;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-tasa:hover {
            background: #2a2a2a;
            border-color: #d4a843;
        }

        /* ===== RESULTADOS ===== */
        .results-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 28px;
        }

        .result-card {
            background: #0d0d0d;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #1a1a1a;
            text-align: center;
            transition: all 0.3s ease;
        }

        .result-card:hover {
            border-color: #2a2a2a;
        }

        .result-card .label {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .result-card .value {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .result-card .value.usd {
            color: #ffffff;
        }

        .result-card .value.local {
            color: #d4a843;
        }

        .result-card .sub {
            color: #666;
            font-size: 12px;
            margin-top: 4px;
        }

        /* ===== LISTA DE PRODUCTOS ===== */
        .products-section {
            margin-bottom: 28px;
        }

        .products-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .products-header h3 {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
        }

        .products-header .count {
            color: #666;
            font-size: 12px;
        }

        .product-list {
            background: #0d0d0d;
            border-radius: 16px;
            border: 1px solid #1a1a1a;
            padding: 4px;
            max-height: 200px;
            overflow-y: auto;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            border-bottom: 1px solid #151515;
            transition: all 0.3s ease;
        }

        .product-item:last-child {
            border-bottom: none;
        }

        .product-item:hover {
            background: #111;
        }

        .product-item .name {
            color: #ddd;
            font-size: 13px;
        }

        .product-item .price {
            color: #d4a843;
            font-weight: 600;
            font-size: 13px;
        }

        .product-item .qv {
            color: #666;
            font-size: 11px;
            margin-left: 8px;
        }

        .product-item .remove {
            background: none;
            border: none;
            color: #444;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            padding: 0 4px;
        }

        .product-item .remove:hover {
            color: #ff4444;
        }

        /* ===== BOTONES DE PRODUCTOS ===== */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 8px;
            margin-bottom: 16px;
        }

        .product-btn {
            background: #0d0d0d;
            border: 1px solid #1a1a1a;
            border-radius: 10px;
            padding: 10px 12px;
            color: #ddd;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        .product-btn:hover {
            background: #1a1a1a;
            border-color: #d4a843;
            transform: translateY(-1px);
        }

        .product-btn .p-name {
            font-weight: 500;
            color: #fff;
        }

        .product-btn .p-detail {
            color: #666;
            font-size: 10px;
            display: block;
            margin-top: 2px;
        }

        /* ===== ACCIONES ===== */
        .actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #d4a843, #b8922f);
            color: #0a0a0a;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 168, 67, 0.25);
        }

        .btn-secondary {
            background: #1a1a1a;
            color: #888;
            border: 1px solid #2a2a2a;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: #222;
            color: #fff;
        }

        /* ===== QV PROGRESS ===== */
        .qv-section {
            background: #0d0d0d;
            border-radius: 16px;
            padding: 16px 20px;
            border: 1px solid #1a1a1a;
            margin-top: 16px;
        }

        .qv-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .qv-header .label {
            color: #888;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .qv-header .value {
            color: #d4a843;
            font-weight: 700;
            font-size: 14px;
        }

        .qv-bar {
            height: 6px;
            background: #1a1a1a;
            border-radius: 3px;
            overflow: hidden;
        }

        .qv-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #d4a843, #f0d060);
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .qv-free-shipping {
            color: #d4a843;
            font-size: 12px;
            margin-top: 8px;
            text-align: right;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .calculator {
                padding: 20px;
            }

            .config-grid {
                grid-template-columns: 1fr;
            }

            .results-section {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .products-grid {
                grid-template-columns: 1fr 1fr;
            }

            .actions {
                flex-direction: column;
            }

            .result-card .value {
                font-size: 22px;
            }
        }

        @media (max-width: 480px) {
            .products-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ===== SCROLL BAR ===== */
        .product-list::-webkit-scrollbar {
            width: 4px;
        }

        .product-list::-webkit-scrollbar-track {
            background: #0d0d0d;
        }

        .product-list::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 2px;
        }

        .product-list::-webkit-scrollbar-thumb:hover {
            background: #d4a843;
        }
    </style>
</head>
<body>

    <div class="calculator" id="app">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <div class="logo">
                <div class="logo-icon">OM</div>
                <div class="logo-text">ONE <span>MORE</span></div>
            </div>
            <div class="badge">Calculadora Premium</div>
        </div>

        <!-- ===== CONFIGURACIÓN ===== -->
        <div class="config-section">
            <div class="config-grid">
                <div class="config-item">
                    <label>País / Moneda</label>
                    <select id="pais">
                        <option value="COL" data-tasa="3118.24" selected>Colombia · COP</option>
                        <option value="VEN" data-tasa="0.00">Venezuela · VES</option>
                        <option value="USA" data-tasa="1.00">Global · USD</option>
                    </select>
                </div>
                <div class="config-item">
                    <label>Tasa de cambio (USD → Local)</label>
                    <div class="tasa-display">
                        <span class="valor" id="tasaDisplay">3118.24</span>
                        <span class="info">COP</span>
                        <button class="btn-tasa" id="btnActualizarTasa">↻ Actualizar</button>
                    </div>
                </div>
            </div>
            <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
                <button class="btn-tasa" id="btnTasaManual" style="background:#1a1a1a; color:#888;">Usar tasa manual</button>
                <input type="number" id="tasaManualInput" placeholder="Ingresa tasa" style="display:none; background:#1a1a1a; color:#fff; border:1px solid #2a2a2a; border-radius:8px; padding:6px 12px; width:120px;">
            </div>
        </div>

        <!-- ===== RESULTADOS ===== -->
        <div class="results-section">
            <div class="result-card">
                <div class="label">Total USD</div>
                <div class="value usd" id="totalUSD">$0.00</div>
                <div class="sub">Precio base</div>
            </div>
            <div class="result-card">
                <div class="label">Total Moneda Local</div>
                <div class="value local" id="totalLocal">$0.00</div>
                <div class="sub" id="monedaLocalLabel">COP</div>
            </div>
        </div>

        <!-- ===== LISTA DE PRODUCTOS ===== -->
        <div class="products-section">
            <div class="products-header">
                <h3>🛒 Productos</h3>
                <span class="count" id="productCount">0 productos</span>
            </div>
            <div class="product-list" id="productList">
                <div style="padding:20px; text-align:center; color:#444; font-size:13px;">
                    Agrega productos desde abajo
                </div>
            </div>
        </div>

        <!-- ===== BOTONES PRODUCTOS ===== -->
        <div class="products-grid" id="productButtons">
            <!-- Generado por JS -->
        </div>

        <!-- ===== ACCIONES ===== -->
        <div class="actions">
            <button class="btn-primary" id="btnAgregarPatologia">🧬 Cargar patología</button>
            <button class="btn-secondary" id="btnLimpiar">🗑️ Limpiar carrito</button>
        </div>

        <!-- ===== QV PROGRESS ===== -->
        <div class="qv-section">
            <div class="qv-header">
                <span class="label">QV Acumulado</span>
                <span class="value" id="qvTotal">0 / 300</span>
            </div>
            <div class="qv-bar">
                <div class="qv-bar-fill" id="qvBar" style="width:0%;"></div>
            </div>
            <div class="qv-free-shipping" id="shippingStatus">🚚 Agrega productos para envío gratis</div>
        </div>

    </div>

    <script>
        // ================================================================
        //  DATOS
        // ================================================================

        const PRODUCTOS = {
            'Melatonin': { precio: 35, qv: 30 },
            'Slim Style': { precio: 32, qv: 25 },
            'Glutamax / Glutamore': { precio: 67, qv: 50 },
            'Painless Night Glut': { precio: 64, qv: 50 },
            'Restore': { precio: 45, qv: 35 },
            'Omega Plus': { precio: 38, qv: 28 },
            'Collagen': { precio: 42, qv: 32 },
            'Energy Boost': { precio: 30, qv: 22 },
        };

        // Patologías con combinaciones sugeridas
        const PATOLOGIAS = {
            'Insomnio': ['Melatonin', 'Melatonin', 'Restore'],
            'Sobrepeso': ['Slim Style', 'Slim Style', 'Glutamax / Glutamore'],
            'Dolor muscular': ['Painless Night Glut', 'Painless Night Glut', 'Omega Plus'],
            'Envejecimiento': ['Collagen', 'Collagen', 'Energy Boost'],
            'Recuperación': ['Glutamax / Glutamore', 'Restore', 'Omega Plus'],
        };

        // ================================================================
        //  ESTADO
        // ================================================================

        let carrito = [];
        let tasaCambio = 3118.24;
        let monedaNombre = 'COP';
        let paisActual = 'COL';

        // ================================================================
        //  DOM REFS
        // ================================================================

        const $ = id => document.getElementById(id);
        const totalUSD = $('totalUSD');
        const totalLocal = $('totalLocal');
        const monedaLocalLabel = $('monedaLocalLabel');
        const productList = $('productList');
        const productCount = $('productCount');
        const qvTotal = $('qvTotal');
        const qvBar = $('qvBar');
        const shippingStatus = $('shippingStatus');
        const tasaDisplay = $('tasaDisplay');
        const paisSelect = $('pais');

        // ================================================================
        //  FUNCIONES PRINCIPALES
        // ================================================================

        function renderProductos() {
            // Limpiar
            productList.innerHTML = '';

            if (carrito.length === 0) {
                productList.innerHTML =
                    `<div style="padding:20px; text-align:center; color:#444; font-size:13px;">Agrega productos desde abajo</div>`;
                updateTotales();
                return;
            }

            // Renderizar cada producto
            carrito.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'product-item';
                div.innerHTML = `
                    <span class="name">${item.nombre} ×${item.cantidad || 1}</span>
                    <span>
                        <span class="price">$${item.precio.toFixed(2)}</span>
                        <span class="qv">QV ${item.qv}</span>
                        <button class="remove" data-index="${index}">✕</button>
                    </span>
                `;
                productList.appendChild(div);
            });

            // Eventos de eliminar
            document.querySelectorAll('.remove').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    carrito.splice(idx, 1);
                    renderProductos();
                });
            });

            updateTotales();
        }

        function updateTotales() {
            // Calcular totales
            let totalUSDVal = 0;
            let totalQV = 0;

            carrito.forEach(item => {
                totalUSDVal += item.precio * (item.cantidad || 1);
                totalQV += item.qv * (item.cantidad || 1);
            });

            // Total en moneda local
            const totalLocalVal = totalUSDVal * tasaCambio;

            // Actualizar UI
            totalUSD.textContent = `$${totalUSDVal.toFixed(2)}`;
            totalLocal.textContent = `$${totalLocalVal.toLocaleString('es-CO', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            monedaLocalLabel.textContent = monedaNombre;

            // Contador
            const totalItems = carrito.reduce((acc, item) => acc + (item.cantidad || 1), 0);
            productCount.textContent = `${totalItems} productos`;

            // QV
            qvTotal.textContent = `${totalQV} / 300`;
            const pct = Math.min((totalQV / 300) * 100, 100);
            qvBar.style.width = `${pct}%`;

            // Envío gratis
            if (totalQV >= 300) {
                shippingStatus.textContent = '✅ ¡ENVÍO GRATIS! Has alcanzado 300 QV';
                shippingStatus.style.color = '#d4a843';
            } else {
                shippingStatus.textContent = `🚚 Faltan ${(300 - totalQV).toFixed(0)} QV para envío gratis`;
                shippingStatus.style.color = '#666';
            }
        }

        function agregarProducto(nombre, cantidad = 1) {
            const producto = PRODUCTOS[nombre];
            if (!producto) return;

            // Buscar si ya existe
            const existente = carrito.find(item => item.nombre === nombre);
            if (existente) {
                existente.cantidad = (existente.cantidad || 1) + cantidad;
            } else {
                carrito.push({
                    nombre: nombre,
                    precio: producto.precio,
                    qv: producto.qv,
                    cantidad: cantidad
                });
            }

            renderProductos();
        }

        function limpiarCarrito() {
            carrito = [];
            renderProductos();
        }

        function cargarPatologia(nombre) {
            const productos = PATOLOGIAS[nombre];
            if (!productos) return;

            // Limpiar primero
            carrito = [];

            // Agregar cada producto sugerido
            productos.forEach(nombreProducto => {
                agregarProducto(nombreProducto, 1);
            });

            renderProductos();
        }

        // ================================================================
        //  BOTONES DE PRODUCTOS
        // ================================================================

        function renderBotonesProductos() {
            const container = $('productButtons');
            container.innerHTML = '';

            Object.keys(PRODUCTOS).forEach(nombre => {
                const btn = document.createElement('button');
                btn.className = 'product-btn';
                const p = PRODUCTOS[nombre];
                btn.innerHTML = `
                    <span class="p-name">${nombre}</span>
                    <span class="p-detail">$${p.precio} · QV ${p.qv}</span>
                `;
                btn.addEventListener('click', () => agregarProducto(nombre, 1));
                container.appendChild(btn);
            });
        }

        // ================================================================
        //  PATOLOGÍAS (select rápido)
        // ================================================================

        function renderPatologias() {
            // Crear un select en el botón de patología
            const btn = $('btnAgregarPatologia');
            const container = document.createElement('div');
            container.style.cssText = 'display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;';

            Object.keys(PATOLOGIAS).forEach(nombre => {
                const tag = document.createElement('span');
                tag.style.cssText =
                    'background:#1a1a1a; color:#d4a843; padding:4px 12px; border-radius:12px; font-size:11px; cursor:pointer; border:1px solid #2a2a2a; transition:all 0.3s ease;';
                tag.textContent = nombre;
                tag.addEventListener('click', () => cargarPatologia(nombre));
                tag.addEventListener('mouseenter', () => {
                    tag.style.borderColor = '#d4a843';
                    tag.style.background = '#222';
                });
                tag.addEventListener('mouseleave', () => {
                    tag.style.borderColor = '#2a2a2a';
                    tag.style.background = '#1a1a1a';
                });
                container.appendChild(tag);
            });

            btn.parentNode.insertBefore(container, btn.nextSibling);
        }

        // ================================================================
        //  TASA DE CAMBIO
        // ================================================================

        function actualizarTasa() {
            const selected = paisSelect.options[paisSelect.selectedIndex];
            const tasa = parseFloat(selected.dataset.tasa);
            if (!isNaN(tasa) && tasa > 0) {
                tasaCambio = tasa;
                tasaDisplay.textContent = tasa.toFixed(2);
                monedaNombre = selected.textContent.split('·')[1]?.trim() || 'COP';
                updateTotales();
            }
        }

        // ================================================================
        //  EVENTOS
        // ================================================================

        paisSelect.addEventListener('change', actualizarTasa);

        $('btnActualizarTasa').addEventListener('click', actualizarTasa);

        $('btnTasaManual').addEventListener('click', function() {
            const input = $('tasaManualInput');
            if (input.style.display === 'none') {
                input.style.display = 'inline-block';
                input.focus();
            } else {
                const val = parseFloat(input.value);
                if (!isNaN(val) && val > 0) {
                    tasaCambio = val;
                    tasaDisplay.textContent = val.toFixed(2);
                    updateTotales();
                }
                input.style.display = 'none';
                input.value = '';
            }
        });

        $('tasaManualInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const val = parseFloat(this.value);
                if (!isNaN(val) && val > 0) {
                    tasaCambio = val;
                    tasaDisplay.textContent = val.toFixed(2);
                    updateTotales();
                }
                this.style.display = 'none';
                this.value = '';
            }
        });

        $('btnLimpiar').addEventListener('click', limpiarCarrito);

        // ================================================================
        //  INICIALIZACIÓN
        // ================================================================

        function init() {
            renderBotonesProductos();
            renderPatologias();
            actualizarTasa();

            // Productos de ejemplo (como en tu captura)
            const productosEjemplo = [
                'Melatonin',
                'Melatonin',
                'Slim Style',
                'Glutamax / Glutamore',
                'Painless Night Glut',
                'Painless Night Glut',
