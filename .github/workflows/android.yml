name: Android

on:
  push:
    branches: [android-control-center]
    paths: ["android-agent/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android-agent/**"]
  workflow_dispatch:

permissions:
  contents: write # publicar el APK en Releases

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ACC_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/acc.jks"
            echo "ACC_KEYSTORE_PATH=$RUNNER_TEMP/acc.jks" >> "$GITHUB_ENV"
            echo "Firmando con la clave del repositorio"
          else
            echo "Sin secreto ACC_KEYSTORE_B64: se firma con una clave de depuración generada en el runner"
            mkdir -p ~/.config/.android ~/.android
            keytool -genkeypair -v -keystore ~/.config/.android/debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.config/.android/debug.keystore ~/.android/debug.keystore
          fi

      - name: Pruebas, lint y APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon test lint assembleRelease 2>&1 | tee build.log || {
            grep -vE "> Task|^\s*$|BUILD FAILED|actionable task" build.log | grep -E "e: |rror|went wrong|failed|Failed|Could not|Cause|>" | tail -10 | while IFS= read -r line; do echo "::error::${line:0:300}"; done
            exit 1
          }
        env:
          ACC_KEYSTORE_PASSWORD: ${{ secrets.ACC_KEYSTORE_PASSWORD }}
          ACC_KEY_ALIAS: ${{ secrets.ACC_KEY_ALIAS }}
          ACC_KEY_PASSWORD: ${{ secrets.ACC_KEY_PASSWORD }}

      - name: Preparar APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk acc-agent.apk
          sha256sum acc-agent.apk | tee acc-agent.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: acc-agent
          path: |
            android-agent/acc-agent.apk
            android-agent/acc-agent.apk.sha256

      - name: Mover la etiqueta al commit actual
        if: github.ref == 'refs/heads/android-control-center' && github.event_name != 'pull_request'
        run: git push -f origin HEAD:refs/tags/acc-agent-latest

      - name: Publicar versión
        if: github.ref == 'refs/heads/android-control-center' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          # Etiqueta fija: el enlace releases/download/acc-agent-latest/acc-agent.apk siempre apunta al último APK
          tag_name: acc-agent-latest
          target_commitish: ${{ github.sha }}
          name: Android Control Agent (último, build ${{ github.run_number }})
          make_latest: false
          body: |
            APK del agente para el laboratorio USB. Guía: docs/android-agent.md

            ```
            adb install -r acc-agent.apk
            adb shell dpm set-device-owner com.acc.agent/.lab.AccDeviceAdminReceiver
            ```
          files: |
            android-agent/acc-agent.apk
            android-agent/acc-agent.apk.sha256
