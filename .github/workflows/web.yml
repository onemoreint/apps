name: Web

on:
  push:
    branches: [android-control-center]
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npm run lint
      - name: Pruebas
        run: npm test
      - name: Compilar
        run: npm run build
        env:
          # Se publica en https://onemoreint.github.io/apps/android-control-center/
          VITE_BASE: /apps/android-control-center/
      - uses: actions/upload-artifact@v4
        with:
          name: panel-web
          path: web/dist
