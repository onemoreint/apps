name: OptiConsulta · publicar en Netlify

# Solo manual. Sube opticonsulta/ al sistema de compilación de Netlify.
# Requiere los secretos NETLIFY_SITE_ID y NETLIFY_DEPLOY_PROXY (nunca en el código).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opticonsulta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar
        env:
          SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          DEPLOY_PROXY: ${{ secrets.NETLIFY_DEPLOY_PROXY }}
        run: npx -y @netlify/mcp@latest --site-id "$SITE_ID" --proxy-path "$DEPLOY_PROXY"
